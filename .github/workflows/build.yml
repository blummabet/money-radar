name: Geld-Radar bauen

# Alle 5 Min: Betfair (Betwatch), Pinnacle, Ergebnisse, Liga-Norm, HZ-Finder laufen hier; Stake und Polymarket auf
# dem Mac-Runner (stake.yml, poly-fluss.yml). Aus dem alten Projekt wird nichts gelesen. Dann Seite bauen,
# Pushes in den Test-Channel, veröffentlichen. Nichts wird ins Repo committet: Betfair-Historie und
# Push-Gedächtnis liegen im Actions-Cache.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      push_test:
        description: 'Nur eine Testnachricht in den Test-Channel schicken'
        type: boolean
        default: false
  # 18.10.: KEIN push-Auslöser mehr. Commit-Läufe haben wartende Kettenläufe verdrängt (13:03–14:03 keine Pushes).
  # Neuer Code kommt mit dem nächsten Kettenlauf (≤ 5 Min) von selbst auf die Seite.

permissions:
  contents: read
  actions: write      # der Lauf stößt am Ende den nächsten an (siehe letzter Schritt)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # ein abgebrochener Lauf würde sein Gedächtnis verlieren → Doppel-Pushes

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Startzeit merken
        run: echo "START=$(date +%s)" >> $GITHUB_ENV
      - name: Gedächtnis laden (Betfair-Historie, Push-Stand)
        uses: actions/cache/restore@v4
        with:
          path: |
            .bf
            .pin
            .push_state
          key: radar-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-
      - name: Polymarket vom Mac-Runner laden (Fluss .pf, Märkte + Wallets .pm)
        uses: actions/cache/restore@v4
        with:
          path: |
            .pf
            .pm
          key: polyfluss-none
          restore-keys: polyfluss-
      - name: Stake vom Mac-Runner laden
        uses: actions/cache/restore@v4
        with:
          path: .st
          key: stake-none
          restore-keys: stake-
      # 25.10. (Lucas: „neues Projekt sauber halten"): keine Startwerte mehr aus dem alten Projekt. Geht der Cache
      # verloren, fängt das Gedächtnis leer an und lernt in wenigen Tagen neu — besser als alte, anders gerechnete Stände.
      # 20.10.2026 (Lucas: „muss autonom im neuen Projekt laufen"): Stake und Polymarket laufen in DIESEM Repo auf dem
      # Mac-Runner (stake.yml, poly-fluss.yml) — das alte Projekt wird nicht mehr angestoßen und nicht mehr gelesen.
      - name: Stake auf dem Mac anstoßen (jeder Lauf)
        if: github.event_name != 'push' && !inputs.push_test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/stake.yml/dispatches" -f ref=main && echo angestoßen || echo "nicht angestoßen"
      - name: Polymarket auf dem Mac anstoßen (jeder Lauf, alle 5 Min)
        if: github.event_name != 'push' && !inputs.push_test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$((10#$(date -u +%M)))
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/poly-fluss.yml/dispatches" -f ref=main && echo angestoßen || echo "nicht angestoßen"
      - name: Betfair abrufen (Betwatch)
        env:
          BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}
        run: python3 fetch_betfair.py || echo "Betfair-Abruf fehlgeschlagen, Seite nimmt den letzten eigenen Stand"
      - name: Betfair weiterverarbeiten (Richtung, Ergebnisse, Liga-Buch, Liga-Norm, HZ 0:0)
        env:
          BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          python3 betfair_direction.py || echo "⚠️ Richtung fehlgeschlagen"
          python3 ergebnisse.py        || echo "⚠️ Ergebnisse fehlgeschlagen"
          python3 liga_norm.py         || echo "⚠️ Liga-Norm fehlgeschlagen"
          timeout 60 python3 hz_finder.py || echo "⚠️ HZ-Finder fehlgeschlagen"
      - name: Pinnacle abrufen (Odds API) und mit Betfair/Polymarket abgleichen
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BF_MAX_ODDS_KEYS: '60'
          BF_ODDS_BUDGET_S: '60'
        run: |
          mkdir -p .pin && cd .pin
          # Eingaben aus dem EIGENEN Abruf: Betfair-Richtung (.bf) und Polymarket-Märkte vom Mac (.pm)
          cp ../.bf/betfair_prices.json ../.bf/betfair_direction.json . 2>/dev/null || true
          python3 - <<'PY'
          import json, pathlib
          try:
              pm = json.loads(pathlib.Path("../.pm/poly_maerkte.json").read_text()).get("maerkte") or {}
          except Exception:
              pm = {}
          vor = {k: v for k, v in pm.items() if not v.get("live")}
          live = {k: v for k, v in pm.items() if v.get("live")}
          for name, d in (("poly_money_upcoming.json", vor), ("poly_money_broad_close.json", vor), ("poly_money_broad_live.json", live)):
              pathlib.Path(name).write_text(json.dumps(d))
          print("Polymarket-Eingaben:", len(vor), "vor Anpfiff,", len(live), "live")
          PY
          if [ -n "$ODDS_API_KEY" ]; then timeout 200 python3 ../pinnacle_konsens.py || echo "Pinnacle-Lauf fehlgeschlagen, Seite nimmt den letzten eigenen Stand"; fi
          rm -f poly_money_broad_close.json poly_money_upcoming.json poly_money_broad_live.json liga_poly_prices.json pinnacle_poly_scan.json
      - name: Daten verdichten
        run: python3 build.py
      - name: Live-Statistik (API-Football, xG und Schüsse für die gezeigten Live-Spiele)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: timeout 90 python3 live_stats.py || echo "Live-Statistik fehlgeschlagen, Seite und Pushes laufen ohne"
      # 26.10.: 30-h-Test — Pinnacle bei API-Football gegen die Odds API (pin_vergleich.py), danach nur noch Auswertung
      - name: Pinnacle-Vergleich API-Football gegen Odds API (Test)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: timeout 60 python3 pin_vergleich.py || echo "Pinnacle-Vergleich fehlgeschlagen"
      - name: Pushes in den Test-Channel
        if: github.event_name != 'push'
        continue-on-error: true   # ein Fehler beim Pushen darf die Seite nicht vom Veröffentlichen abhalten
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          PUSH_TEST: ${{ inputs.push_test && '1' || '' }}
        run: python3 push.py
      - name: Gedächtnis sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .bf
            .pin
            .push_state
          key: radar-${{ github.run_id }}-${{ github.run_attempt }}
      # 23.10.: Jeder Lauf (und jeder Mac-Lauf) legt einen neuen Cache an — 3.560 Stück, 10,7 GB, über der Grenze von
      # 10 GB. Dann räumt GitHub selbst ab und erwischte zeitweise den frischen Polymarket-Stand (Seite ohne Polymarket).
      # Je Präfix bleiben die neuesten 8, der Rest geht weg (höchstens 150 je Lauf, sonst bremst es die Kette).
      - name: Alte Caches aufräumen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo, tok = os.environ["REPO"], os.environ["GH_TOKEN"]
          def api(pfad, methode="GET"):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/{pfad}", method=methode,
                                           headers={"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read() or b"{}") if methode == "GET" else None
          alle, seite = [], 1
          while seite <= 40:
              d = api(f"caches?per_page=100&page={seite}&sort=created_at&direction=desc")
              alle += d.get("actions_caches") or []
              if len(d.get("actions_caches") or []) < 100: break
              seite += 1
          je, weg = {}, []
          for c in alle:                                  # neueste zuerst
              pre = c["key"].split("-")[0]
              je[pre] = je.get(pre, 0) + 1
              if je[pre] > 8: weg.append(c)
          n = 0
          for c in weg[-150:]:                            # die ältesten zuerst
              try: api(f"caches/{c['id']}", "DELETE"); n += 1
              except Exception: pass
          print(f"Caches: {len(alle)} gesamt, {n} alte gelöscht, {len(weg) - n} bleiben für später")
          PY
      # 26.10.2026 (Lucas: „teilweise 10 Min nichts neu, obwohl 5 Min"): das Pages-CDN (Fastly) hält data.json bis
      # 10 Min und ignoriert ?t=… — gemessen in Wien: neue Query, trotzdem HIT mit age > 0. Deshalb bekommt jeder Stand
      # eine EIGENE Datei d/<stand>.json (nie zuvor abgefragt → kommt frisch vom Ursprung), und der Zeiger darauf
      # steht in 404.html: eine Abfrage auf einen zufälligen Pfad ist immer ein MISS und liefert den aktuellen Zeiger.
      - name: Frische-Zeiger (eigene Datei je Stand)
        run: |
          python3 - <<'PY'
          import json, re, shutil
          from pathlib import Path
          d = json.loads(Path("site/data.json").read_text(encoding="utf-8"))
          stempel = re.sub(r"[^0-9]", "", d.get("generatedAt", ""))[:14] or "0"
          Path("site/d").mkdir(exist_ok=True)
          shutil.copy("site/data.json", f"site/d/{stempel}.json")
          if Path("site/statistik.json").exists():
              shutil.copy("site/statistik.json", f"site/d/{stempel}-s.json")   # 30.10.: Statistik-Seite, gleicher Zeiger
          Path("site/404.html").write_text(f"""<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geldradar</title>
          <style>body{{font:16px system-ui,sans-serif;background:#0f141c;color:#e8edf5;display:grid;place-items:center;min-height:100vh;margin:0}}a{{color:#ffb547}}</style></head>
          <body data-stand="d/{stempel}.json"><p>Diese Seite gibt es nicht. <a href="/money-radar/">Zum Geldradar</a></p></body></html>""", encoding="utf-8")
          print("Zeiger:", stempel)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # 17.10.2026: GitHub hat in den ersten Stunden KEINEN einzigen geplanten Lauf gestartet (bekanntes
      # Verhalten bei neuen Repos, und auch später oft verzögert). Deshalb hält sich der Takt selbst:
      # jeder Lauf wartet, bis 5 Minuten seit seinem Start um sind, und stößt dann den nächsten an.
      # Der Zeitplan oben bleibt als Notanker, falls die Kette einmal reißt. Läuft schon ein anderer
      # Lauf oder wartet einer, wird nichts angestoßen — so entsteht nie eine zweite Kette.
      - name: Nächsten Lauf anstoßen
        if: always() && github.event_name != 'push' && !inputs.push_test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rest=$(( 300 - ($(date +%s) - START) ))
          [ $rest -gt 0 ] && sleep $rest
          # 26.10. (Kette stand 14:23–17:28 UTC, 3 h ohne Pushes; Zeitplan und Wächter feuerten in der Zeit nicht):
          # IMMER anstoßen (die Gruppe „pages" hält höchstens einen wartenden Lauf, doppelt ist harmlos) und danach
          # PRÜFEN, ob GitHub wirklich einen neuen Lauf angelegt hat — sonst bis zu dreimal neu.
          for v in 1 2 3; do
            seit=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" -f ref=main || { echo "Anstoß fehlgeschlagen (Versuch $v)"; sleep 10; continue; }
            for w in 1 2 3 4 5 6; do
              sleep 10
              neu=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=10" \
                --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.created_at >= \"$seit\")] | length")
              [ "$neu" != "0" ] && { echo "nächster Lauf angelegt (Versuch $v)"; exit 0; }
            done
            echo "kein neuer Lauf sichtbar nach Versuch $v"
          done
          echo "::warning::Kette: kein neuer Lauf angelegt — Zeitplan/Wächter müssen übernehmen"

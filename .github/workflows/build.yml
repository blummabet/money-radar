name: Geld-Radar bauen

# Phase 1: keine eigenen API-Abfragen. Liest die JSON-Dateien des alten Projekts
# (blummabet/betting-dashboard, öffentlich), verdichtet sie zu site/data.json und
# veröffentlicht die Seite über GitHub Pages. Nichts wird ins Repo committet.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # alle 15 Min, versetzt zur alten Pipeline (die committet um :00/:15/…)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # ein abgebrochener Lauf würde sein Push-Gedächtnis verlieren → Doppel-Pushes

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Daten verdichten
        run: python3 build.py
      # Push-Gedächtnis (was schon im Test-Channel war) lebt im Actions-Cache, nicht im Repo.
      - name: Push-Gedächtnis laden
        uses: actions/cache/restore@v4
        with:
          path: .push_state
          key: radar-push-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-push-
      - name: Pushes in den Test-Channel
        if: github.event_name != 'push'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
        run: python3 push.py
      - name: Push-Gedächtnis sichern
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: .push_state
          key: radar-push-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

name: Geld-Radar bauen

# Alle 5 Min: Betfair holt das Repo selbst (Betwatch, läuft auf GitHub-Servern), alles andere liest
# es aus den JSON-Dateien des alten Projekts (blummabet/betting-dashboard). Dann Seite bauen,
# Pushes in den Test-Channel, veröffentlichen. Nichts wird ins Repo committet: Betfair-Historie und
# Push-Gedächtnis liegen im Actions-Cache.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      push_test:
        description: 'Nur eine Testnachricht in den Test-Channel schicken'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  actions: write      # der Lauf stößt am Ende den nächsten an (siehe letzter Schritt)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # ein abgebrochener Lauf würde sein Gedächtnis verlieren → Doppel-Pushes

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Startzeit merken
        run: echo "START=$(date +%s)" >> $GITHUB_ENV
      - name: Gedächtnis laden (Betfair-Historie, Push-Stand)
        uses: actions/cache/restore@v4
        with:
          path: |
            .bf
            .pin
            .push_state
          key: radar-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-
      - name: Betfair-Historie beim ersten Mal aus dem alten Projekt übernehmen
        run: |
          mkdir -p .bf
          if [ ! -s .bf/betfair_history.json ]; then
            curl -sf https://raw.githubusercontent.com/blummabet/betting-dashboard/main/betfair_history.json -o .bf/betfair_history.json || true
            curl -sf https://raw.githubusercontent.com/blummabet/betting-dashboard/main/betfair_prices.json -o .bf/betfair_prices.json || true
            touch -d '2 hours ago' .bf/betfair_prices.json 2>/dev/null || true
          fi
      # Stake und Polymarket gehen nur vom Mac (Cloudflare/Geo-Sperre für Rechenzentren). Statt die
      # Logik zu kopieren, stößt dieses Repo die Mac-Workflows des ALTEN Projekts öfter an — per
      # workflow_dispatch, das zählt nicht gegen dessen ausgereiztes Zeitplan-Kontingent. Deren
      # concurrency (cancel-in-progress: false) reiht höchstens einen wartenden Lauf ein, es staut sich nichts.
      #   poly-live-scan  alle 5 Min (vorher 15) · betfair.yml mit Stake alle 10 Min (vorher 15) ·
      #   poly-global-scan alle 15 Min (vorher 30)
      - name: Mac-Läufe im alten Projekt anstoßen (Stake, Polymarket)
        if: github.event_name != 'push' && !inputs.push_test
        env:
          GH_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "OLD_REPO_TOKEN fehlt — übersprungen"; exit 0; }
          m=$((10#$(date -u +%M)))
          stoss () { gh api -X POST "repos/blummabet/betting-dashboard/actions/workflows/$1/dispatches" -f ref=main >/dev/null 2>&1 && echo "angestoßen: $1" || echo "nicht angestoßen: $1"; }
          stoss poly-live-scan.yml
          [ $((m % 10)) -lt 5 ] && stoss betfair.yml
          [ $((m % 15)) -lt 5 ] && stoss poly-global-scan.yml
          true
      - name: Betfair abrufen (Betwatch)
        env:
          BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}
        run: python3 fetch_betfair.py || echo "Betfair-Abruf fehlgeschlagen, Seite nimmt die Daten des alten Projekts"
      - name: Pinnacle abrufen (Odds API) und mit Betfair/Polymarket abgleichen
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BF_MAX_ODDS_KEYS: '60'
          BF_ODDS_BUDGET_S: '60'
        run: |
          mkdir -p .pin && cd .pin
          RAW=https://raw.githubusercontent.com/blummabet/betting-dashboard/main
          # Gedächtnis-Dateien nur beim ersten Mal aus dem alten Projekt, danach führt dieses Repo sie selbst
          for f in betfair_consensus_history.json odds_sports.json betfair_anker.json money_map_ledger.json; do
            [ -s "$f" ] || curl -sf "$RAW/$f" -o "$f" || true
          done
          # Eingaben, die das alte Projekt laufend erneuert (Polymarket kommt vom Mac)
          for f in betfair_direction.json poly_money_broad_close.json poly_money_broad_live.json poly_money_upcoming.json liga_poly_prices.json pinnacle_poly_scan.json; do
            curl -sf "$RAW/$f" -o "$f.neu" && mv "$f.neu" "$f" || true
          done
          cp ../.bf/betfair_prices.json . 2>/dev/null || curl -sf "$RAW/betfair_prices.json" -o betfair_prices.json
          if [ -n "$ODDS_API_KEY" ]; then timeout 200 python3 ../pinnacle_konsens.py || echo "Pinnacle-Lauf fehlgeschlagen, Seite nimmt das alte Projekt"; fi
          rm -f poly_money_broad_close.json   # 20 MB, wird jedes Mal frisch geholt — nicht in den Cache
      - name: Daten verdichten
        run: python3 build.py
      - name: Pushes in den Test-Channel
        if: github.event_name != 'push'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          PUSH_TEST: ${{ inputs.push_test && '1' || '' }}
        run: python3 push.py
      - name: Gedächtnis sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .bf
            .pin
            .push_state
          key: radar-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # 17.10.2026: GitHub hat in den ersten Stunden KEINEN einzigen geplanten Lauf gestartet (bekanntes
      # Verhalten bei neuen Repos, und auch später oft verzögert). Deshalb hält sich der Takt selbst:
      # jeder Lauf wartet, bis 5 Minuten seit seinem Start um sind, und stößt dann den nächsten an.
      # Der Zeitplan oben bleibt als Notanker, falls die Kette einmal reißt. Läuft schon ein anderer
      # Lauf oder wartet einer, wird nichts angestoßen — so entsteht nie eine zweite Kette.
      - name: Nächsten Lauf anstoßen
        if: always() && github.event_name != 'push' && !inputs.push_test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rest=$(( 300 - ($(date +%s) - START) ))
          [ $rest -gt 0 ] && sleep $rest
          andere=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\")] | length")
          if [ "$andere" = "0" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" -f ref=main
            echo "nächster Lauf angestoßen"
          else
            echo "es läuft/wartet schon ein Lauf ($andere) — keine zweite Kette"
          fi

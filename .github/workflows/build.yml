name: Geld-Radar bauen

# Phase 1: keine eigenen API-Abfragen. Liest die JSON-Dateien des alten Projekts
# (blummabet/betting-dashboard, öffentlich), verdichtet sie zu site/data.json und
# veröffentlicht die Seite über GitHub Pages. Nichts wird ins Repo committet.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # alle 15 Min, versetzt zur alten Pipeline (die committet um :00/:15/…)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Daten verdichten
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

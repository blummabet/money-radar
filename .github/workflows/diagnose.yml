name: Diagnose (Zustand lesen)

# 18.11. (Lucas: „Das kam in Public — was waren da die Gründe?"): liest eine Zustandsdatei aus dem Gedächtnis (Cache vom
# Mac) und gibt nur die Einträge aus, in denen der Suchtext vorkommt. Schreibt nichts ins Repo, nichts in den Cache.
on:
  workflow_dispatch:
    inputs:
      datei:
        description: 'Pfad, z. B. .push_state/public.json'
        required: true
        default: .push_state/public.json
      suche:
        description: 'Suchtext (Teil reicht)'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  lesen:
    runs-on: [self-hosted, bau]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            .bf
            .pin
            .push_state
            .rp
          key: diagnose-${{ github.run_id }}
          restore-keys: radar-
      - name: Lesen
        env:
          DATEI: ${{ inputs.datei }}
          SUCHE: ${{ inputs.suche }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["DATEI"]).resolve()
          basis = pathlib.Path.cwd().resolve()
          assert basis in p.parents and p.suffix == ".json", "nur JSON im Arbeitsordner"
          d = json.loads(p.read_text())
          s = os.environ["SUCHE"].lower()
          def gehe(o, pfad=""):
              if isinstance(o, dict):
                  t = json.dumps(o, ensure_ascii=False)
                  if s in t.lower() and len(t) < 6000 and not any(isinstance(v, (dict, list)) and s in json.dumps(v, ensure_ascii=False).lower() and len(json.dumps(v)) > 1500 for v in o.values()):
                      print(pfad, t); print(); return
                  for k, v in o.items(): gehe(v, f"{pfad}/{k}")
              elif isinstance(o, list):
                  for i, v in enumerate(o): gehe(v, f"{pfad}[{i}]")
          gehe(d)
          PY

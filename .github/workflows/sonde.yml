name: Sonde (Betwatch + Stake vom GitHub-Server)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/sonde.py
        env:
          BETWATCH_KEY: ${{ secrets.BETWATCH_KEY }}

name: Polymarket-Fluss (Mac)

# Wohin fließt auf Polymarket das neue Geld (Käufe je Seite, 30/10 Min)? Läuft auf dem Mac-Runner
# „radar", weil Polymarket Rechenzentren blockt. Angestoßen vom Seitenbau etwa alle 10 Min.
# Ergebnis reist über den Actions-Cache (Schlüssel polyfluss-…) zum Seitenbau — kein Commit.
on:
  workflow_dispatch:
    inputs:
      bericht:
        description: 'Ergebnis zusätzlich als Issue (zum Prüfen)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: poly-fluss
  cancel-in-progress: false

jobs:
  fluss:
    runs-on: [self-hosted, radar]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Käufe je Seite holen
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          PY=python3
          for p in /opt/homebrew/bin/python3.11 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.13; do [ -x "$p" ] && { PY="$p"; break; }; done
          "$PY" poly_fluss.py 2>&1 | tee pf.log
      - uses: actions/cache/save@v4
        with:
          path: .pf
          key: polyfluss-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Bericht als Issue
        if: always() && inputs.bericht
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          { tail -20 pf.log; echo; echo '```'; python3 -c "import json;d=json.load(open('.pf/poly_fluss.json'));[print(m['titel'][:40], m['fenster'].get('30')) for m in d['maerkte'][:8]]" 2>&1; echo '```'; } > bericht.txt
          gh issue create -R ${{ github.repository }} --title "Poly-Fluss $(date -u +%FT%H:%MZ)" --body-file bericht.txt

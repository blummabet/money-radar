name: Cache-Check (per Hand)

# 23.10.: Polymarket kommt im Seitenbau nicht mehr an, obwohl der Mac-Lauf grün ist. Prüft, welchen Cache der
# Seitenbau findet und was drin ist, und legt das Ergebnis als Issue ab.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: pf
        uses: actions/cache/restore@v4
        with:
          path: |
            .pf
            .pm
          key: polyfluss-none
          restore-keys: polyfluss-
      - id: st
        uses: actions/cache/restore@v4
        with:
          path: .st
          key: stake-none
          restore-keys: stake-
      - name: Bericht
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "polyfluss gefunden: '${{ steps.pf.outputs.cache-matched-key }}'"
            echo "stake gefunden: '${{ steps.st.outputs.cache-matched-key }}'"
            echo '```'; ls -la .pf .pm .st 2>&1; echo '```'
            echo "## Caches (neueste 15)"; echo '```'
            gh api "repos/${{ github.repository }}/actions/caches?per_page=15&sort=created_at" -q '.total_count, (.actions_caches[]|[.key,.size_in_bytes,.version[0:10],.created_at]|@tsv)' 2>&1
            echo; gh api "repos/${{ github.repository }}/actions/cache/usage" 2>&1
            echo '```'
          } > b.md
          gh issue create -R ${{ github.repository }} --title "Cache-Check $(date -u +%FT%H:%MZ)" --body-file b.md

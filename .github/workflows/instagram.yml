name: Instagram

# 04.11.2026 (Lucas): zwei Posts am Tag auf @cocobet89.
#   morgen ~9:25 Wien  „Gestern im Kanal"  (Bilanz der Public-Signale des Vortags)
#   abend  ~17:10 Wien „Wo das Geld liegt" (Top 3 Geld über der Quote, aus site/ig_top3.json)
#   wal    ~18:15 Wien Story „Wal des Tages" (größte Polymarket-Position auf ein Abendspiel); Auflösung im Morgenlauf
# Zeiten in UTC (Winterzeit +1 h). Je Art höchstens ein Post am Tag (bilder/gepostet.json).
on:
  schedule:
    - cron: '23 8 * * *'
    - cron: '9 16 * * *'
    - cron: '13 17 * * *'
    - cron: '3 18 * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'morgen, abend, wal oder woche_test'
        default: 'morgen'
      trocken:
        description: 'nur Bild bauen, nicht posten'
        type: boolean
        default: true
      erzwingen:
        description: 'auch wenn heute schon gepostet'
        type: boolean
        default: false
      woche_ab:
        description: 'nur woche_test: so tun, als wäre es dieser Montag (z. B. 2026-11-09T09:00)'
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chromium für die Grafik
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Grafik bauen und posten
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          PUBLIC_CHAT_ID: "-1003819239615"
          WOCHE_AB: ${{ inputs.woche_ab }}
          GH_TOKEN: ${{ github.token }}
          TROCKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.trocken && '1' || '' }}
          ERZWINGEN: ${{ inputs.erzwingen && '1' || '' }}
          WAL_FENSTER_H: ${{ inputs.trocken && '9' || '' }}
        run: |
          M="${{ inputs.modus }}"
          if [ -z "$M" ]; then
            case "${{ github.event.schedule }}" in
              '13 17 * * *'|'3 18 * * *') M=wal ;;
              '23 8 * * *') M=morgen ;;
              '9 16 * * *') M=abend ;;
              *) H=$(date -u +%H); [ "$H" -lt 12 ] && M=morgen || M=abend ;;
            esac
          fi
          set -o pipefail
          python social/posten.py "$M" 2>&1 | tee ig.log
      - name: Fehler als Issue (ohne Token)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -40 ig.log 2>/dev/null | sed -E 's/(access_token=)[^& ]+/\1***/g'; echo '```'; } > fehler.md
          gh issue create -R ${{ github.repository }} --title "Instagram-Fehler $(date -u +%FT%H:%MZ)" --body-file fehler.md

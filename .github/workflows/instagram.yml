name: Instagram

# 04.11.2026 (Lucas): zwei Posts am Tag auf @cocobet89.
#   morgen ~9:25 Wien  „Gestern im Kanal"  (Bilanz der Public-Signale des Vortags)
#   abend  ~17:10 Wien „Wo das Geld liegt" (Top 3 Geld über der Quote, aus site/ig_top3.json)
# Zeiten in UTC (Winterzeit +1 h). Je Art höchstens ein Post am Tag (bilder/gepostet.json).
on:
  schedule:
    - cron: '23 8 * * *'
    - cron: '9 16 * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'morgen oder abend'
        default: 'morgen'
      trocken:
        description: 'nur Bild bauen, nicht posten'
        type: boolean
        default: true
      erzwingen:
        description: 'auch wenn heute schon gepostet'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Chromium für die Grafik
        run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium >/dev/null
      - name: Grafik bauen und posten
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ github.token }}
          TROCKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.trocken && '1' || '' }}
          ERZWINGEN: ${{ inputs.erzwingen && '1' || '' }}
        run: |
          M="${{ inputs.modus }}"
          if [ -z "$M" ]; then H=$(date -u +%H); [ "$H" -lt 12 ] && M=morgen || M=abend; fi
          python3 social/posten.py "$M"

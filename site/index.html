<!doctype html>
<html lang="de" data-theme="hell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f2f4">
<script>try{const t=localStorage.getItem("radar-thema");if(t)document.documentElement.dataset.theme=t;}catch(_){}</script>
<title>Geldradar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1320; --panel:#151d2d; --panel-2:#1b2538; --panel-3:#233049;
  --text:#f1f4fa; --text-2:#b9c3d6; --text-3:#8a96ad;
  --line:rgba(255,255,255,.065);
  --bf:#ffb547; --pin:#5b9dff; --poly:#a183ff; --stake:#2fd38a; --hz:#ff77a8;
  --up:#2fd38a; --down:#ff6b6b;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pin);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:0 10px 22px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,var(--bf),var(--poly),var(--pin),var(--stake),var(--bf));display:grid;place-items:center}
.logo-mark::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg)}
.nav{background:none;border:0;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--text-2);font-weight:600;font-size:14px;text-align:left;width:100%}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.an{background:var(--panel-2);color:var(--text)}
.nav .dot{width:9px;height:9px;border-radius:3px;flex:none}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--text-2);background:var(--panel-3);border-radius:999px;padding:1px 7px}
.aside-fuss{margin-top:auto;padding:12px;font-size:12px;color:var(--text-3)}
.aside-fuss .q{display:flex;align-items:center;gap:7px;margin:4px 0;color:var(--text-2)}
.q i{width:7px;height:7px;border-radius:50%;flex:none}

main{padding:22px 28px 60px;min-width:0}
.kopf{display:flex;align-items:center;gap:14px;margin:-22px -28px 20px;padding:14px 28px;position:sticky;top:0;z-index:15;background:rgba(13,19,32,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.kopf h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.kopf .sub{color:var(--text-2);font-size:13px}
.kopf .rechts{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.puls{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(47,211,138,.6);animation:puls 2s infinite}
@keyframes puls{70%{box-shadow:0 0 0 8px rgba(47,211,138,0)}100%{box-shadow:0 0 0 0 rgba(47,211,138,0)}}
@media (prefers-reduced-motion:reduce){.puls{animation:none}}

.seite{display:none}.seite.an{display:block}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{margin:0;font-size:15px;font-weight:700;white-space:nowrap}
.ph{display:flex;align-items:center;gap:6px 10px;margin-bottom:14px;flex-wrap:wrap}
.ph .hint{color:var(--text-3);font-size:12.5px}
.ph .rechts{margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip.an{background:var(--text);color:var(--bg);border-color:var(--text)}

.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lab{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;font-weight:600}
.ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.kpi .wert{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .neben{font-size:12.5px;color:var(--text-2)}
.kpi svg{position:absolute;right:14px;bottom:14px}

.tab{width:100%;border-collapse:collapse}
.tab th{text-align:left;font-size:12px;font-weight:600;color:var(--text-3);padding:0 10px 10px;white-space:nowrap}
.tab th.r,.tab td.r{text-align:right}
.tab td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tab tr.zeile{cursor:pointer}
.tab tr.zeile:hover td{background:rgba(255,255,255,.025)}
.tab tr.offen td{background:var(--panel-2)}
.tab tr.detail td{background:var(--panel-2);border-top:0;padding:4px 16px 18px}
.spiel{display:flex;align-items:center;gap:10px;min-width:0;max-width:300px}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.nur-m{display:none}
.ohne-vt .vt{display:none}
.flag{width:22px;height:16px;border-radius:3px;object-fit:cover;flex:none;background:var(--panel-3)}
.spiel .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spiel .l{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12.5px;color:var(--text-2);white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--down);font-weight:700;white-space:nowrap}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--down)}
.geld{font-weight:800;font-size:14.5px;white-space:nowrap}
.plus{color:var(--up);font-weight:700;font-size:12px;white-space:nowrap}
.norm{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:3px 9px;border-radius:8px;font-weight:800;font-size:13px}
.vbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;min-width:110px;background:var(--panel-3)}
.vbar span{height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2);margin-top:6px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.leg b{color:var(--text)}
.det{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:22px;padding-top:6px}
.det h4{margin:0 0 8px;font-size:12.5px;color:var(--text-3);font-weight:600}
.mini-liste{font-size:13px;color:var(--text-2)}
.mini-liste div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.mini-liste b{color:var(--text)}

.feed{display:flex;flex-direction:column}
/* Wo am meisten liegt */
.toepfe{display:grid;gap:10px}
.tp-fazit{font-size:13px;color:var(--text-2);margin:2px 0 6px}
.tp-fazit b{color:var(--text)}
.tp-fazit.ok{color:var(--up)}.tp-fazit.ok b{color:var(--up)}
.tp-fazit.nein{color:var(--bf)}
.tp-fazit.leise{color:var(--text-3)}
.tp-fazit.wal{color:var(--poly)}
.lt-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.lt{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lt-1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.lt-1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt-2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-2);margin-top:5px}
.lt-3{font-size:11.5px;color:var(--text-3);margin-top:3px}
.tz-kopf{margin:20px 0 8px;font-size:13px;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:8px}
.tz-kopf span:not(.puls){font-size:11.5px;background:var(--panel-3);border-radius:999px;padding:1px 8px;color:var(--text-2)}
.tz-kopf.lauf{color:var(--down)}
.tz-kopf.lauf .puls{background:var(--down)}
.tz-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px}
.tz{border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;background:var(--panel-2)}
.tz.lauf{background:color-mix(in srgb, var(--down) 7%, var(--panel-2))}
.tz-1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.tz-ico{display:flex;align-items:center}.tz-ico .flag{width:18px;height:12px}
.tz-t{min-width:0;display:flex;flex-direction:column;gap:1px}
.tz-t b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tz-t small{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tz-stand{color:var(--text)}
.tz-g{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.tz-2{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11.5px;color:var(--text-2);padding-left:28px;flex-wrap:wrap}
.tz-bar{display:flex;gap:2px;width:80px;height:5px;border-radius:3px;overflow:hidden;flex:none}
.tz-bar i{display:block;height:100%}
.tz-vor b{color:var(--text)}
.tz-u{font-weight:700;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:auto}
.tz-u.ok{color:var(--up);background:color-mix(in srgb, var(--up) 14%, transparent)}
.tz-u.nein{color:var(--bf);background:color-mix(in srgb, var(--bf) 16%, transparent)}
.tz-u.wal{margin-left:0;background:none;padding:0}
.topf{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;cursor:pointer;transition:border-color .15s}
.topf:hover,.topf:focus-visible{border-color:color-mix(in srgb, var(--text) 18%, transparent);outline:none}
.tp-kopf{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.tp-rang{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--panel-3);color:var(--text-2);font-variant-numeric:tabular-nums}
.topf:nth-child(1) .tp-rang{background:var(--text);color:var(--bg)}
.tp-titel{min-width:0;display:flex;flex-direction:column;gap:2px}
.tp-titel b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-titel span{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:2px}
.tp-titel .flag{width:16px;height:11px}
.tp-summe{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tp-summe b{font-size:19px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tp-urteil{font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px}
.tp-urteil.ok{background:color-mix(in srgb, var(--up) 16%, transparent);color:var(--up)}
.tp-urteil.nein{background:color-mix(in srgb, var(--bf) 18%, transparent);color:var(--bf)}
.tp-balken{margin:10px 0 7px;height:8px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.tp-balken{display:flex;gap:2px}
.tp-balken i{display:block;height:100%}
.tp-balken.leer{background:repeating-linear-gradient(90deg,var(--panel-3) 0 6px,transparent 6px 10px)}
.tp-sl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-3);margin:-2px 0 8px}
.tp-sl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-sl span.top{color:var(--text);font-weight:700}
.tp-sl b{font-variant-numeric:tabular-nums}
.tp-raster.zwei{grid-template-columns:1fr 1fr}
.tp-quellen{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--text-3)}
/* Lucas 19.10.: „sah besser aus mit den verschiedenen Sourcen" — je Quelle eine lesbare Zeile: Name, Geld, wohin */
.tp-qz{display:grid;gap:5px;margin-top:4px}
.tp-q{display:grid;grid-template-columns:minmax(92px,auto) auto 1fr;align-items:center;gap:10px;font-size:13.5px;padding:6px 10px;border-radius:9px;background:color-mix(in srgb, var(--f) 9%, var(--panel-2));}
.tp-q .qn{color:var(--f);font-weight:700}
.tp-q .qg{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.tp-q .qa{color:var(--text-2);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-q .qa b{color:var(--text)}
.tp-q .qa.schwach{color:var(--text-3)}
.tp-q small{color:var(--text-3);font-size:11.5px;font-weight:500}
.tp-quellen span{display:inline-flex;align-items:center;gap:6px}
.tp-quellen i{width:8px;height:8px;border-radius:2px}
.tp-quellen b{color:var(--text);font-variant-numeric:tabular-nums}
.tp-quellen small{color:var(--text-3)}
.tp-raster{display:grid;grid-template-columns:1fr .8fr 1fr;gap:6px;margin-top:9px}
.tp-sp{background:var(--panel);border-radius:10px;padding:6px 8px 7px;min-width:0;border:1px solid transparent}
.tp-sp.lead{border-color:color-mix(in srgb, var(--text) 14%, transparent)}
.tp-sn{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.tp-sp.lead .tp-sn{color:var(--text);font-weight:700}
.tp-pills{display:flex;flex-wrap:wrap;gap:4px;min-height:20px}
.tp-pill{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:color-mix(in srgb, var(--f) 18%, transparent);color:var(--f);white-space:nowrap}
.tp-pill b{color:var(--text);font-weight:800}
.tp-pill.schwach{opacity:.45}
.tp-pill.wal{--f:var(--poly);background:transparent;border:1px dashed color-mix(in srgb, var(--poly) 60%, transparent)}
.wal-tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:color-mix(in srgb, var(--poly) 16%, transparent);color:var(--poly);white-space:nowrap;vertical-align:2px}
.tp-leer{color:var(--text-3);font-size:12px;line-height:20px}
.tp-sp.leer{background:transparent;padding-bottom:0}
.tp-sp.leer .tp-pills{min-height:0}
.tp-sn{display:flex;gap:5px;align-items:baseline}
.tp-sn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-sn b{font-weight:800;flex:none}
.tp-hinweis{font-size:12px;color:var(--text-3);margin-top:8px}
.tp-banner{border-radius:10px;padding:10px 12px;font-size:13.5px}
.tp-banner.ok{background:color-mix(in srgb, var(--up) 12%, transparent);color:var(--text)}
.tp-banner.nein{background:color-mix(in srgb, var(--bf) 14%, transparent);color:var(--text)}
/* Topf-Karte 19.10. (2. Anlauf) */
.tp-gb{display:flex;gap:3px;height:6px;margin:12px 0 6px}
.tp-gb i{display:block;border-radius:3px}
.tp-gz{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.tp-gz small{font-weight:600;opacity:.75;font-size:12px}
.tp-k{display:grid;grid-template-columns:1fr .75fr 1fr;gap:8px;margin-top:12px}
.tp-k.zwei{grid-template-columns:1fr 1fr}
.tp-kk{background:var(--panel);border-radius:12px;padding:9px 11px 10px;min-width:0;display:flex;flex-direction:column;gap:2px}
.tp-kk .n{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tp-kk>b{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--text-2);font-variant-numeric:tabular-nums;line-height:1.15}
.tp-kk.lead{background:#f2f5fb}
.tp-kk.lead .n{color:#3a4458} .tp-kk.lead>b{color:#0d1320}
.tp-cs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;min-height:0}
.tp-c{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--f);color:#0d1320;white-space:nowrap;font-variant-numeric:tabular-nums}
.tp-c.schwach{opacity:.55}
.tp-c.wal{--f:var(--poly)}
.legende{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;font-weight:700;color:var(--text-2);margin-left:auto}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{width:10px;height:10px;border-radius:50%}
@media (min-width:1300px){ .toepfe{grid-template-columns:1fr 1fr} }

.sankey-k{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px;color:var(--text-2);font-size:12px}.sankey-k b{color:var(--text);font-size:18px;font-weight:800}
.saeulen{display:block;width:100%;height:50px;margin-top:10px}
.serie-k{}
.serie-kopf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.serie-n{font-weight:800;font-size:14px}
.serie-tag{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:color-mix(in srgb, var(--bf) 18%, transparent);color:var(--bf);vertical-align:2px;white-space:nowrap}
.pm-net{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.pm-net span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-bar{position:relative;height:8px;background:var(--panel-3);border-radius:4px}
.pm-bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--text-3)}
.pm-bar i{position:absolute;top:0;bottom:0}
.pm-g{right:50%;background:var(--down);border-radius:4px 0 0 4px}
.pm-f{left:50%;background:var(--up);border-radius:0 4px 4px 0}
.ticker{display:none}
.feed-gross .fe{padding:12px 4px}
.feed-gross .fe .t{font-size:14.5px}
.fe[data-dr]{cursor:pointer}
.fe-live{}
.feedchips{margin-bottom:6px;flex-wrap:wrap}
.fe{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fe:first-child{border-top:0}
.fe .ico{width:34px;height:34px;border-radius:10px}
.fe .t{font-weight:600;font-size:13.5px;line-height:1.3}
.fe .s{font-size:12px;color:var(--text-3);margin-top:2px}
.fe .b{text-align:right;font-weight:800;white-space:nowrap}
.fe .b small{display:block;font-weight:600;font-size:11.5px;color:var(--text-3)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;vertical-align:1px;margin-left:5px;white-space:nowrap}
.t-won{background:rgba(47,211,138,.14);color:var(--up)}.t-lost{background:rgba(255,107,107,.14);color:var(--down)}.t-open{background:var(--panel-3);color:var(--text-2)}

.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.karte{background:var(--panel-2);border-radius:13px;padding:14px;border:1px solid var(--line)}
.karte .k1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.karte .auf{font-weight:800;font-size:15px;display:flex;align-items:center;gap:4px}
.karte .auf .sico{width:18px;height:18px;font-size:13px}
.karte .pp{font-weight:800;color:var(--pin);font-size:15px;white-space:nowrap}
.karte .sp{font-size:12px;color:var(--text-3);margin-top:2px}
.karte .unten{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-2);margin-top:8px}
.karte svg{width:100%;margin-top:6px}

.ringe{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px 10px;text-align:center}

/* ── Look 19.10. (Lucas: Dribbble-Vorbilder) — EIN Satz Bausteine, zwei Themes. Standard hell (Vorbilder „Skypulse"/„Tendra"),
   dunkel per Schalter oben rechts. Alles Farbige läuft über die Variablen unten, nichts fest verdrahtet. ── */
:root,:root[data-theme="dunkel"]{ --bg:#07080c; --panel:#0f1117; --panel-2:#151821; --panel-3:#1e2230; --line:rgba(255,255,255,.07);
  --text:#ffffff; --text-2:#c4c9d6; --text-3:#8d93a5; --akzent:#8b6cff; --akzent-text:#fff;
  --glas-a:rgba(255,255,255,.045); --glas-b:rgba(255,255,255,.012); --rand:rgba(255,255,255,.08); --kante:rgba(255,255,255,.06);
  --schatten:0 20px 40px -24px rgba(0,0,0,.8); --flaeche:rgba(255,255,255,.035); --flaeche-2:rgba(255,255,255,.07);
  --hover:rgba(255,255,255,.03); --leise-zahl:#5d6377; --glow:rgba(139,108,255,.65); --kopf-bg:rgba(7,8,12,.72);
  --chip-text:#0d1320; --lead-bg:#f2f5fb; --lead-text:#0d1320; --lead-sub:#3a4458;
  --deko:radial-gradient(900px 500px at 12% -8%, rgba(139,108,255,.20), transparent 60%),
    radial-gradient(800px 600px at 105% 30%, rgba(47,211,138,.08), transparent 60%),
    radial-gradient(700px 500px at 40% 110%, rgba(91,157,255,.08), transparent 60%); }
:root[data-theme="hell"]{ --bg:#f1f2f4; --panel:#ffffff; --panel-2:#f6f7f9; --panel-3:#e9ebef; --line:#e3e5e9;
  --text:#121418; --text-2:#4a5162; --text-3:#858c9a; --akzent:#121418; --akzent-text:#fff;
  --bf:#e08600; --pin:#2f6fe0; --poly:#7a5af8; --stake:#0e9c58; --hz:#de4579; --up:#159947; --down:#d92d2d;
  --glas-a:#ffffff; --glas-b:#ffffff; --rand:#e3e5e9; --kante:rgba(255,255,255,0);
  --schatten:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -14px rgba(16,24,40,.12); --flaeche:#f7f8fa; --flaeche-2:#eceef2;
  --hover:#f4f5f7; --leise-zahl:#b3b8c3; --glow:transparent; --kopf-bg:rgba(241,242,244,.86);
  --chip-text:#ffffff; --lead-bg:#121418; --lead-text:#ffffff; --lead-sub:#b9bec9; --deko:none; }
body{background:var(--deko), var(--bg);background-attachment:fixed}
aside{background:var(--kopf-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav.an{background:var(--flaeche-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--rand)}

  .st-z{grid-template-columns:minmax(0,1fr) 38px 62px 58px 46px;gap:6px;font-size:12.5px} .st-ql{min-width:0;width:100%} .st-zn small{display:none} }
/* Lucas 28.10.: Live-Statistik im Spiel-Fenster als Duell-Zeilen */

/* Markt-Charts: Geld-Wand (Treemap) + Hitparade — Lucas 19.10.: „ganz eigene Darstellung" */
:root[data-theme="dunkel"]{--mw-sieg:#5b7cff;--mw-tore:#1fc2a4;--mw-hz:#ff77a8;--mw-rest:#8f98ae}
:root[data-theme="hell"]{--mw-sieg:#3456e0;--mw-tore:#0d9a82;--mw-hz:#d43f78;--mw-rest:#69718a}
.mw{position:relative;width:100%;border-radius:14px;overflow:visible;margin-top:6px}
.mw-k{position:absolute;box-sizing:border-box;padding:2px}
.mw-i{height:100%;box-sizing:border-box;border-radius:10px;background:color-mix(in srgb, var(--f) 13%, var(--glas-a));padding:9px 10px 8px;display:flex;flex-direction:column;gap:1px;overflow:hidden;cursor:pointer;color:var(--text);transition:filter .15s}
.mw-i:hover{filter:brightness(1.06)}
.mw-i:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
.mw-i.heiss{background:var(--f);color:#fff}
/* Lucas 20.10.: laufende Spiele dezent anders umrandet — feine rote Innenkante plus kleiner Punkt */
.mw-i.laeuft{box-shadow:0 0 0 2px var(--down)}              /* Ring außen im Zwischenraum — sichtbar auf hellen UND kräftigen Kacheln */
.mw-i.laeuft .mw-sp::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--down);margin-right:5px;vertical-align:1px}
.mw-i.heiss.laeuft .mw-sp::before{background:#fff}
.mw-sp{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-m{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-m b{color:var(--text);font-weight:700}
.mw-i.heiss .mw-m,.mw-i.heiss .mw-m b{color:rgba(255,255,255,.88)}
.mw-fuss{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;min-width:0}
.mw-e{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap;line-height:1.1}
.mw-k.g .mw-e{font-size:24px} .mw-k.g.xl .mw-e{font-size:38px;letter-spacing:-.03em}
:root[data-theme="dunkel"] .mw-i.heiss{background:color-mix(in srgb, var(--f) 72%, #000)} .mw-k.m .mw-e{font-size:17px}
.mw-n{font-size:11px;font-weight:800;white-space:nowrap;padding:1px 6px;border-radius:999px;background:color-mix(in srgb, var(--f) 22%, transparent);color:var(--f)}
.mw-i.heiss .mw-n{background:rgba(255,255,255,.22);color:#fff}
.mw-s{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:6px;gap:1px}
.mw-s i{display:block;background:var(--f)}
.mw-i.heiss .mw-s i{background:#fff}
.mw-k.k .mw-m,.mw-k.k .mw-s,.mw-k.xs .mw-m,.mw-k.xs .mw-s,.mw-k.xs .mw-n{display:none}
.mw-k.xs .mw-i{padding:6px 7px} .mw-k.xs .mw-sp{font-size:11px} .mw-k.xs .mw-e{font-size:12px}
.mw-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--text-3)}
.mw-leg span{display:inline-flex;align-items:center;gap:6px}
.mw-leg i{width:12px;height:12px;border-radius:4px;display:inline-block}
.hp{display:flex;flex-direction:column}
.hp-z{display:grid;grid-template-columns:40px 50px minmax(0,1fr) 130px 120px;gap:14px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer}
.hp-z+.hp-z{border-top:1px solid var(--rand)}
.hp-z:hover{background:var(--hover)}
.hp-r{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--leise-zahl);text-align:right;line-height:1}
.hp-z:nth-child(-n+3) .hp-r{color:var(--text)}
.hp-b{font-size:12.5px;font-weight:800;white-space:nowrap}
.hp-b.auf{color:var(--up)} .hp-b.ab{color:var(--down)} .hp-b.gl{color:var(--text-3)}
.hp-b.neu{display:inline-block;padding:2px 7px;border-radius:999px;background:var(--bf);color:#fff;font-size:11px;letter-spacing:.02em}
.hp-t{min-width:0}
.hp-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-t small{display:block;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-t small em{font-style:normal;color:var(--text);font-weight:700}
.hp-sp svg{display:block;width:100%;height:30px}
.hp-g{text-align:right;white-space:nowrap}
.hp-g b{display:block;font-size:15px;font-weight:800}

.hp-g small.auf{color:var(--up)}
@media (max-width:700px){
  .hp-z{grid-template-columns:30px 40px minmax(0,1fr) auto;gap:10px;padding:9px 4px}
  .hp-r{font-size:21px} .hp-sp{display:none}
}
/* Säulen „neues Geld je 10 Min" im Spiel-Detail */
.gs{position:relative;margin-top:8px;padding-top:16px}
.gs-g{position:absolute;left:0;right:0;top:16px;height:110px;pointer-events:none}

/* kompakte Zufluss-Zeilen (Betfair-Seite) */
.zrl{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
.zr{padding:10px 4px 12px;border-bottom:1px solid var(--rand);cursor:pointer;min-width:0}

/* Lucas 26.10.: Quellen-Bild im „Wo am meisten liegt"-Fenster */
.qx{display:flex;flex-direction:column;gap:2px;background:var(--flaeche);border:1px solid var(--rand);border-radius:16px;padding:12px 10px 8px}
.qx-r{display:grid;grid-template-columns:86px repeat(var(--n), minmax(0,1fr));align-items:center;gap:4px;padding:6px 0;border-top:1px solid var(--line)}

.pm-tz{display:grid;grid-template-columns:1fr auto 64px;gap:8px;font-size:12px;color:var(--text-2)}.pm-tz b{text-align:right;font-variant-numeric:tabular-nums}
/* Merkliste (24.10.) */
.dk-knoepfe{margin-left:auto;display:flex;gap:6px}
.dk-knoepfe .dk-teilen{margin-left:0}
.dk-merk{font:inherit;font-size:12.5px;font-weight:700;color:var(--text);background:var(--flaeche-2);border:1px solid var(--rand);border-radius:999px;padding:4px 12px;cursor:pointer}
.dk-merk.an{color:#3a2a00;background:#f5c542;border-color:#f5c542}
.mt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.mt-l{font-size:12px;color:var(--text-3);font-weight:700}
.mt-c{font:inherit;font-size:12.5px;font-weight:700;color:var(--text);background:var(--glas-a);border:1px solid var(--rand);border-radius:10px;padding:4px 9px;cursor:pointer}
.mt-c small{color:var(--text-3);font-weight:600}
.mt-c.an{border-color:#f5c542;box-shadow:inset 0 0 0 1px #f5c542;background:color-mix(in srgb, #f5c542 14%, transparent)}
.merk-badge{font:inherit;font-size:13px;font-weight:800;color:#3a2a00;background:#f5c542;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.merk-badge[hidden]{display:none}
.merk-panel[hidden]{display:none}
.mzs{display:flex;flex-direction:column;gap:8px}
.mz{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 40px 11px 14px;border-radius:14px;background:var(--glas-a);border:1px solid var(--rand);border-left:3px solid #f5c542;cursor:pointer}
.mz.fertig{border-left-color:var(--text-3);opacity:.92}
.mz-i{min-width:0;display:flex;flex-direction:column;gap:4px}
.mz-t{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mz-t span{color:var(--text-3);font-weight:600}
.mz-tipp{font-size:12.5px;color:var(--text-2)}.mz-tipp b{color:var(--text)}.mz-tipp small{color:var(--text-3)}
.mz-ab{color:var(--up)}.mz-auf{color:var(--down)}
.mz-r{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.mz-plus{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text-2)}.mz-plus.pos{color:var(--up)}
.mz-r small{font-size:11px;color:var(--text-3)}
.mz-end{font-weight:900;color:var(--text)}
.mz-warte{color:var(--text-3);font-weight:600}
.mz-w{font-size:20px;font-weight:900;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.mz-w.ok{color:#06140d;background:var(--up)}.mz-w.no{color:#fff;background:var(--down)}
.mz-x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--text-3);font-size:13px;cursor:pointer}
.mz-x:hover{background:var(--panel-3);color:var(--text)}
/* Auswertung: zugeklappter Block je Seite */
.ausw{border:1px dashed var(--rand);border-radius:var(--r);padding:12px 16px}
.ausw>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ausw>summary::-webkit-details-marker{display:none}
.ausw>summary::before{content:"▸";color:var(--text-3);transition:transform .15s}
.ausw[open]>summary::before{transform:rotate(90deg)}
.ausw-t{font-weight:800;font-size:15px}.ausw-u{color:var(--text-3);font-size:12.5px}
.ausw-g{margin-top:14px}
/* Live: neue Daten */
#stand.frisch{color:var(--up);font-weight:700}
.kopf .rechts.neu{animation:standNeu 1.6s ease-out}
@keyframes standNeu{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--up) 70%, transparent);border-color:var(--up)}100%{box-shadow:0 0 0 12px transparent}}
.bk-mehr{position:relative;animation:bkMehr 2.6s ease-out}
@keyframes bkMehr{0%,25%{box-shadow:0 0 0 2px var(--up), 0 0 22px color-mix(in srgb, var(--up) 40%, transparent)}100%{box-shadow:0 0 0 0 transparent}}
.bk-neu{animation:bkNeu .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bkNeu{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
.bk-plus{position:absolute;top:6px;right:6px;font-size:11.5px;font-weight:900;color:#06140d;background:var(--up);padding:1px 7px;border-radius:999px;pointer-events:none;animation:bkPlus 3s ease-out forwards;z-index:3;box-shadow:0 2px 10px rgba(0,0,0,.25)}
@keyframes bkPlus{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.saeulen .s-letzt{transform-box:fill-box;transform-origin:bottom}
.bk-mehr .saeulen .s-letzt,.bk-neu .saeulen .s-letzt{animation:saeuleWachs 1s cubic-bezier(.2,.9,.3,1.2) .2s both}
@keyframes saeuleWachs{from{transform:scaleY(0)}}
.bk-mehr .serie-n{animation:serieN 1.4s ease-out}
@keyframes serieN{0%,30%{color:var(--up);text-shadow:0 0 12px var(--up)}}
@media (prefers-reduced-motion:reduce){ .bk-mehr,.bk-neu,.bk-plus,.t3-b i,.kopf .rechts.neu,.bk-mehr .saeulen .s-letzt,.bk-neu .saeulen .s-letzt{animation:none} .bk-plus{display:none} }
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><span class="logo-mark"></span>Geldradar</div>
  <div id="navliste"></div>
  <div class="aside-fuss"><div style="margin-bottom:6px">Datenstand</div><div id="quellen"></div></div>
</aside>
<main>
  <div class="kopf"><div><h1 id="titel">Übersicht</h1><div class="sub" id="untertitel"></div></div><div id="ligaschalter"></div><button class="merk-badge" id="merkBadge" data-merkliste hidden aria-label="Deine gemerkten Spiele">★ <b>0</b></button><div class="rechts"><span class="puls" id="puls"></span><span id="stand">lädt</span></div><button class="thema-knopf" id="thema" aria-label="Hell oder dunkel"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button></div>
  <section class="seite an" id="s-start"></section>
  <section class="seite" id="s-feed"></section>
  <section class="seite" id="s-betfair"></section>
  <section class="seite" id="s-pinnacle"></section>
  <section class="seite" id="s-poly"></section>
  <section class="seite" id="s-stake"></section>
  <section class="seite" id="s-hz"></section>
  <section class="seite" id="s-statistik"></section>
</main>
</div>
<nav class="unten-nav" id="untennav" aria-label="Bereiche"></nav>
<div class="dr-schleier" data-zu></div>
<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-titel"><div class="dr-kopf"><h3 id="dr-titel"></h3><button class="dr-x" data-zu aria-label="Schließen">✕</button></div><div id="dr-inhalt"></div></aside>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TZ = "Europe/Vienna";
const uhr = iso => iso ? new Date(iso).toLocaleTimeString("de-AT",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}) : "";
const wtag = iso => new Date(iso).toLocaleDateString("de-AT",{timeZone:TZ,weekday:"short"});
const minBis = iso => Math.round((new Date(iso)-Date.now())/60000);
function wann(iso){
  if(!iso) return "";
  const m = minBis(iso);
  if(m <= 0) return "läuft";
  if(m < 60) return `in ${m} Min`;
  if(m < 12*60) return `in ${Math.floor(m/60)}:${String(m%60).padStart(2,"0")} h`;
  const heute = new Date().toLocaleDateString("de-AT",{timeZone:TZ}) === new Date(iso).toLocaleDateString("de-AT",{timeZone:TZ});
  return (heute ? "" : wtag(iso)+" ") + uhr(iso);
}
function vor(iso){
  const m = Math.round((Date.now()-new Date(iso))/60000);
  if(m < 1) return "jetzt"; if(m < 60) return `vor ${m} Min`;
  const h = Math.floor(m/60); return h < 24 ? `vor ${h} h` : `vor ${Math.floor(h/24)} T`;
}
const kurz = (v, z) => { if(v==null) return "–"; const a=Math.abs(v), s=v<0?"-":"";
  return s+z+(a>=1e6?(a/1e6).toFixed(a>=1e7?0:1).replace(".",",")+" Mio":a>=1e4?Math.round(a/1e3)+"k":a>=1e3?(a/1e3).toFixed(1).replace(".",",")+"k":Math.round(a)); };
const eur = v => kurz(v,"€"), usd = v => kurz(v,"$");
const dez = (v,n=1) => v==null ? "–" : Number(v).toFixed(n).replace(".",",");
const tagKurz = iso => iso ? new Date(iso).toLocaleDateString("de-AT",{timeZone:TZ,day:"numeric",month:"numeric"}) : "–";
const q2 = v => v==null ? "–" : Number(v).toFixed(2).replace(".",",");
const istRemis = n => /^(the draw|draw|remis)/i.test(n||"");
const nm = n => istRemis(n) ? "Remis" : n;
const flagge = cc => {
  cc = String(cc||"").toLowerCase(); if(cc==="uk") cc="gb";
  return /^[a-z]{2}$/.test(cc) ? `<img class="flag" src="https://flagcdn.com/w40/${cc}.png" alt="" loading="lazy">` : `<span class="flag" style="display:inline-grid;place-items:center;font-size:10px;color:var(--text-3);vertical-align:-2px">◎</span>`;
};
const FARBE = {betfair:"var(--bf)",pinnacle:"var(--pin)",poly:"var(--poly)",stake:"var(--stake)",hz:"var(--hz)"};
const ICO = {betfair:"BF",pinnacle:"PIN",poly:"PM",stake:"ST",hz:"HZ"};
const tint = (farbe, a) => `color-mix(in srgb, ${farbe} ${a}%, transparent)`;
const icon = q => `<span class="ico" style="background:${tint(FARBE[q],16)};color:${FARBE[q]}">${ICO[q]}</span>`;

function spark(werte, farbe, w=110, h=32){
  if(!werte || werte.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const min=Math.min(...werte), max=Math.max(...werte), sp=(max-min)||1;
  const pt = werte.map((v,i)=>[i/(werte.length-1)*w, h-2-(v-min)/sp*(h-5)]);
  const d = pt.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const id = "g"+Math.random().toString(36).slice(2,8);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${farbe}" stop-opacity=".35"/><stop offset="1" stop-color="${farbe}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${farbe}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function ring(prozent, farbe, mitte){
  const r=34, u=2*Math.PI*r, p=Math.max(0,Math.min(100,prozent||0));
  return `<svg width="86" height="86" viewBox="0 0 86 86" aria-hidden="true"><circle cx="43" cy="43" r="${r}" fill="none" stroke="var(--panel-3)" stroke-width="8"/><circle cx="43" cy="43" r="${r}" fill="none" stroke="${farbe}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(u*p/100).toFixed(1)} ${u.toFixed(1)}" transform="rotate(-90 43 43)"/><text x="43" y="48" text-anchor="middle" style="fill:var(--text)" font-size="14" font-weight="800" font-family="Manrope">${esc(mitte)}</text></svg>`;
}
function farbeTeil(teile){
  const top = Math.max(...teile.filter(t=>!istRemis(t.name)).map(t=>t.wert));
  return t => istRemis(t.name) ? "var(--text-3)" : t.wert===top ? "var(--bf)" : "var(--pin)";
}
function vbar(teile){
  teile = (teile||[]).filter(t=>t.wert>0);
  const ges = teile.reduce((a,t)=>a+t.wert,0); if(!ges) return "";
  const f = farbeTeil(teile);
  return `<div class="vbar">${teile.map(t=>`<span style="flex:${t.wert} 1 0;background:${f(t)}" title="${esc(nm(t.name))} ${Math.round(t.wert/ges*100)} %"></span>`).join("")}</div>`;
}
function legende(teile, zusatz){
  teile = (teile||[]).filter(t=>t.wert>0);
  const ges = teile.reduce((a,t)=>a+t.wert,0); if(!ges) return "";
  const f = farbeTeil(teile);
  return `<div class="leg">${teile.map(t=>`<span><i style="background:${f(t)}"></i>${esc(nm(t.name))} <b>${Math.round(t.wert/ges*100)} %</b>${zusatz?" "+zusatz(t):""}</span>`).join("")}</div>`;
}
function normPill(x){
  if(x==null) return `<span class="norm" style="background:var(--panel-3);color:var(--text-3)">–</span>`;
  const f = x>=3 ? "var(--down)" : x>=1.5 ? "var(--bf)" : x>=1 ? "var(--text-2)" : "var(--text-3)";
  return `<span class="norm" style="background:${tint(f,14)};color:${f}">×${dez(x)}</span>`;
}

function statusZelle(s){
  if(s.live) return `<span class="live">${s.live.ht?"HZ":s.live.min!=null?s.live.min+"'":"live"}</span> <b>${s.live.stand?.[0]??0}:${s.live.stand?.[1]??0}</b>`;
  return `<span class="status">${wann(s.anpfiff)}</span>`;
}
function spielZeile(s, i){
  const vt = s.verteilung ? s.verteilung.map(v=>({name:v.name,wert:v.eur})) : null;
  return `<tr class="zeile" data-i="${i}" tabindex="0" aria-expanded="false">
    <td><div class="spiel">${flagge(s.land)}<div style="min-width:0"><div class="n">${esc(s.heim)} – ${esc(s.gast)}</div><div class="l"><span class="nur-m">${s.live?`<span style="color:var(--down);font-weight:700">${s.live.ht?"HZ":s.live.min!=null?s.live.min+"'":"live"} ${s.live.stand?.[0]??0}:${s.live.stand?.[1]??0}</span>`:wann(s.anpfiff)}, </span>${esc(s.liga)}</div></div></div></td>
    <td class="hide-m">${statusZelle(s)}</td>
    <td class="r"><div class="geld">${eur(s.eur)}</div>${s.d60>0?`<div class="plus">+${eur(s.d60)} in 1 h</div>`:""}</td>
    <td class="r">${normPill(s.xnorm)}</td>
    <td class="hide-m">${spark(s.kurve, "var(--bf)")}</td>
    <td class="hide-m vt">${vt?vbar(vt):`<span style="color:var(--text-3);font-size:12px;white-space:nowrap">${s.quoten.heim?`${q2(s.quoten.heim)} / ${q2(s.quoten.remis)} / ${q2(s.quoten.gast)}`:""}</span>`}</td>
  </tr>`;
}
// ── Serien / Dauerzufluss (Lucas 17.10.: „wichtiger KPI in meinen Augen") ─────────────────────
// Eine Säule je Abruf (Betfair 5 Min, Polymarket 10 Min): Stoß = eine hohe Säule, Dauerzufluss = viele.
function saeulenSvg(werte, farbe, w=260, h=42, schritt=5, tore=[]){
  const v = werte||[], bw = w / Math.max(1, v.length);
  const mx = Math.max(1, ...v) * ((tore||[]).some(t=>t.i>=0&&t.i<v.length) ? 1.3 : 1);   // Platz für die Tor-Beschriftung
  // Lucas 18.10.: Tor im Säulenbild — gestrichelte Linie an der Säule, an der sich der Stand änderte, Stand obendrauf
  const tor = (tore||[]).filter(t=>t.i>=0&&t.i<v.length).map(t=>{ const x=(t.i*bw-0.5).toFixed(1);
    return `<line x1="${x}" x2="${x}" y1="9" y2="${h}" stroke="var(--text)" stroke-width="1" stroke-dasharray="2 2" opacity=".75"/><text x="${x}" y="7" font-size="8.5" font-weight="700" fill="var(--text)" text-anchor="${t.i>v.length*0.8?"end":"middle"}">⚽ ${t.stand.join(":")}</text>`; }).join("");
  let li = -1; v.forEach((x,i)=>{ if(x>0) li = i; });
  const bars = v.map((x,i)=> x>0 ? `<rect${i===li?' class="s-letzt"':""} x="${(i*bw+0.5).toFixed(1)}" y="${(h - Math.max(2, x/mx*h)).toFixed(1)}" width="${Math.max(1, bw-1.5).toFixed(1)}" height="${Math.max(2, x/mx*h).toFixed(1)}" rx="1.5" fill="${farbe}"/>` : `<rect x="${(i*bw+0.5).toFixed(1)}" y="${h-1.5}" width="${Math.max(1,bw-1.5).toFixed(1)}" height="1.5" fill="var(--panel-3)"/>`).join("");
  const std = v.length*schritt/60;
  return `<svg class="saeulen" viewBox="0 0 ${w} ${h+12}" preserveAspectRatio="none" role="img" aria-label="neues Geld je ${schritt} Minuten"><g>${bars}</g>${tor}
    <text x="0" y="${h+11}" font-size="9" fill="var(--text-3)">vor ${dez(std,0)} h</text><text x="${w}" y="${h+11}" font-size="9" fill="var(--text-3)" text-anchor="end">jetzt</text></svg>`;
}
const serieVon = (D, id) => (D.serien||[]).find(x=>x.id===id);
const serieTag = x => x ? `<span class="serie-tag" title="${x.n} Abrufe in Folge Geld auf dieselbe Auswahl">🔁 ${x.n}×</span>` : "";
function serienKarten(D, max, quelle){
  const bf = quelle==="poly"||quelle==="stake" ? [] : lf(D.serien||[]);
  const pm = quelle==="betfair"||quelle==="stake" ? [] : (D.polySerien||[]).filter(top5Ok);
  const st = quelle==="betfair"||quelle==="poly" ? [] : (D.stakeSerien||[]).filter(top5Ok);
  const alle = [...bf, ...pm, ...st].sort((a,b)=>(b.n-a.n)||((b.eur||b.usd)-(a.eur||a.usd))).slice(0,max);
  if(!alle.length) return `<div class="leer">Gerade läuft nirgends wiederholt Geld auf dieselbe Auswahl${ligaModus==="ohne"?" (ohne Top-5)":""}. Eine Serie beginnt ab drei Abrufen in Folge.</div>`;
  return `<div class="kgrid">${alle.map(x=>{
    const istBf = x.quelle==="betfair", sp = istBf ? spielInfo(x) : null;
    const titel = istBf ? `${esc(x.heim)} – ${esc(x.gast)}` : esc(pmTitel(x.titel));
    const lv = sp?.live;
    const rechts = lv ? `<span class="live">${lv.min!=null?lv.min+"'":"live"}</span> ${lv.stand?.[0]??0}:${lv.stand?.[1]??0}` : x.live ? `<span class="live">live</span>` : wann(x.anpfiff);
    const istSt = x.quelle==="stake", farbe = istBf ? "var(--bf)" : istSt ? "var(--stake)" : "var(--poly)";
    const pmM = x.quelle==="poly" ? (D.polyFluss?.maerkte||[]).find(m=>m.key===x.id) : null;
    const kl = sp ? klick(titel, ohneHuelle(spielDetail(sp))) : pmM ? klick(titel, ohneHuelle(polyFlussDetail(pmM))) : "";
    return `<div class="kk serie-k" ${kl}${bk("se|"+x.quelle+"|"+x.id+"|"+(x.markt||"")+"|"+x.auswahl, x.n)}>
      <div class="kk-oben">${istBf?flagge(x.land):sportIco(x.sport)}<span>${esc(ligaName(x.liga)||x.sport||"")}</span><span class="rechts">${rechts}</span></div>
      <div class="kk-titel">${titel} ${x.quelle==="poly"?waleTag(waleVon(x.id)):""}</div>
      <div class="serie-kopf"><span class="serie-n">🔁 ${x.n}× in Folge</span><span class="tag" style="background:${tint(farbe,16)};color:${farbe}">${istBf?"Betfair":istSt?"Stake":"Polymarket"}</span></div>
      <div class="kk-zahl" style="color:${farbe}">${istBf?eur(x.eur):usd(x.usd)} <small style="font-size:13px;color:var(--text-2);font-weight:600">in ${x.dauerMin} Min</small></div>
      <div class="kk-auf">auf <b>${esc(istBf?auswahlDe(x.auswahl):istSt?x.auswahl:pmLabel(x.auswahl, x.titel, x.sport))}</b>${x.quote?` @ ${q2(x.quote)}`:""}${x.preis?` <small style="color:var(--text-3)">(${Math.round(x.preis*100)} ¢)</small>`:""}${x.quoteStart&&x.quote&&Math.abs(x.quote-x.quoteStart)>=0.02?` <span class="${x.quote<x.quoteStart?"hoch":"runter"}">${x.quote<x.quoteStart?"↓":"↑"} von ${q2(x.quoteStart)}</span>`:""}</div>
      ${istBf?liveStat(x.id):""}
      ${istBf&&x.tor?`<div class="kk-klein" style="color:var(--bf)">⚽ Tor während der Serie (${x.tor.von.join(":")} → ${x.tor.nach.join(":")}): ${eur(x.tor.vorTor)} vorher, ${eur(x.tor.nachTor)} danach</div>`:""}
      ${istBf?`<div class="kk-klein">${esc(marktDe(x.markt))}${x.letzteVorMin!=null?`, zuletzt vor ${x.letzteVorMin} Min`:""}</div>`:istSt?`<div class="kk-klein">${esc(x.markt)}, ${x.wetten} Wetten ab $1000</div>`:""}
      ${saeulenSvg(istBf ? x.saeulen.slice(-24) : x.saeulen, farbe, 260, 38, istBf?5:10, istBf ? (x.tore||[]).map(t=>({...t, i:t.i-(x.saeulen.length-24)})) : [])}
    </div>`;}).join("")}</div>`;
}
// Lucas 24.10. („erkennt man immer noch nicht gut, sieht alles gleich aus"): statt Fluss-Bändern eine Leiter — eine

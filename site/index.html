<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1320">
<title>Geldradar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1320; --panel:#151d2d; --panel-2:#1b2538; --panel-3:#233049;
  --text:#e9eef7; --text-2:#9aa7bd; --text-3:#64718a;
  --line:rgba(255,255,255,.065);
  --bf:#ffb547; --pin:#5b9dff; --poly:#a183ff; --stake:#2fd38a; --hz:#ff77a8;
  --up:#2fd38a; --down:#ff6b6b;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pin);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:0 10px 22px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,var(--bf),var(--poly),var(--pin),var(--stake),var(--bf));display:grid;place-items:center}
.logo-mark::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg)}
.nav{background:none;border:0;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--text-2);font-weight:600;font-size:14px;text-align:left;width:100%}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.an{background:var(--panel-2);color:var(--text)}
.nav .dot{width:9px;height:9px;border-radius:3px;flex:none}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--text-2);background:var(--panel-3);border-radius:999px;padding:1px 7px}
.aside-fuss{margin-top:auto;padding:12px;font-size:12px;color:var(--text-3)}
.aside-fuss .q{display:flex;align-items:center;gap:7px;margin:4px 0;color:var(--text-2)}
.q i{width:7px;height:7px;border-radius:50%;flex:none}

main{padding:22px 28px 60px;min-width:0}
.kopf{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.kopf h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.kopf .sub{color:var(--text-2);font-size:13px}
.kopf .rechts{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.puls{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(47,211,138,.6);animation:puls 2s infinite}
@keyframes puls{70%{box-shadow:0 0 0 8px rgba(47,211,138,0)}100%{box-shadow:0 0 0 0 rgba(47,211,138,0)}}
@media (prefers-reduced-motion:reduce){.puls{animation:none}}

.seite{display:none}.seite.an{display:block}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{margin:0;font-size:15px;font-weight:700;white-space:nowrap}
.ph{display:flex;align-items:center;gap:6px 10px;margin-bottom:14px;flex-wrap:wrap}
.ph .hint{color:var(--text-3);font-size:12.5px}
.ph .rechts{margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip.an{background:var(--text);color:var(--bg);border-color:var(--text)}

.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lab{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;font-weight:600}
.ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.kpi .wert{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .neben{font-size:12.5px;color:var(--text-2)}
.kpi svg{position:absolute;right:14px;bottom:14px}

.tab{width:100%;border-collapse:collapse}
.tab th{text-align:left;font-size:12px;font-weight:600;color:var(--text-3);padding:0 10px 10px;white-space:nowrap}
.tab th.r,.tab td.r{text-align:right}
.tab td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tab tr.zeile{cursor:pointer}
.tab tr.zeile:hover td{background:rgba(255,255,255,.025)}
.tab tr.offen td{background:var(--panel-2)}
.tab tr.detail td{background:var(--panel-2);border-top:0;padding:4px 16px 18px}
.spiel{display:flex;align-items:center;gap:10px;min-width:0;max-width:300px}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.nur-m{display:none}
.ohne-vt .vt{display:none}
.flag{width:22px;height:16px;border-radius:3px;object-fit:cover;flex:none;background:var(--panel-3)}
.spiel .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spiel .l{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12.5px;color:var(--text-2);white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--down);font-weight:700;white-space:nowrap}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--down)}
.geld{font-weight:800;font-size:14.5px;white-space:nowrap}
.plus{color:var(--up);font-weight:700;font-size:12px;white-space:nowrap}
.norm{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:3px 9px;border-radius:8px;font-weight:800;font-size:13px}
.vbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;min-width:110px;background:var(--panel-3)}
.vbar span{height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2);margin-top:6px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.leg b{color:var(--text)}
.det{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:22px;padding-top:6px}
.det h4{margin:0 0 8px;font-size:12.5px;color:var(--text-3);font-weight:600}
.mini-liste{font-size:13px;color:var(--text-2)}
.mini-liste div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.mini-liste b{color:var(--text)}

.feed{display:flex;flex-direction:column}
.fe{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fe:first-child{border-top:0}
.fe .ico{width:34px;height:34px;border-radius:10px}
.fe .t{font-weight:600;font-size:13.5px;line-height:1.3}
.fe .s{font-size:12px;color:var(--text-3);margin-top:2px}
.fe .b{text-align:right;font-weight:800;white-space:nowrap}
.fe .b small{display:block;font-weight:600;font-size:11.5px;color:var(--text-3)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;vertical-align:1px;margin-left:5px;white-space:nowrap}
.t-won{background:rgba(47,211,138,.14);color:var(--up)}.t-lost{background:rgba(255,107,107,.14);color:var(--down)}.t-open{background:var(--panel-3);color:var(--text-2)}

.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.karte{background:var(--panel-2);border-radius:13px;padding:14px;border:1px solid var(--line)}
.karte .k1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.karte .auf{font-weight:800;font-size:15px}
.karte .pp{font-weight:800;color:var(--pin);font-size:15px;white-space:nowrap}
.karte .sp{font-size:12px;color:var(--text-3);margin-top:2px}
.karte .unten{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-2);margin-top:8px}
.karte svg{width:100%;margin-top:6px}

.ringe{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.ring .w{font-size:12px;color:var(--text-2);margin-top:6px;line-height:1.3}
.ring .w b{display:block;color:var(--text);font-size:13px}

.leer{color:var(--text-3);padding:18px 0;text-align:center}
.zufluss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.zf{background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:14px;border-left:3px solid var(--up)}
.zf-kopf{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.zf-betrag{font-weight:800;font-size:22px;color:var(--up);text-align:right;white-space:nowrap;line-height:1.1}
.zf-betrag small{display:block;font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:3px}
.zf-auf{font-size:13px;color:var(--text-2);margin:8px 0 2px}
.zf-auf b{color:var(--text)}
.quoten-zug{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.quoten-zug .alt{font-size:15px;color:var(--text-3);font-weight:700;text-decoration:line-through}
.quoten-zug .pfeil{color:var(--text-3)}
.quoten-zug .neu{font-size:24px;font-weight:800;color:var(--text)}
.push-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));column-gap:28px}
.push-raster .fe:first-child{border-top:1px solid var(--line)}
.mehr{background:none;border:0;color:var(--text-2);font-weight:700;padding:12px 0 0;font-size:13px}
.mehr:hover{color:var(--text)}
.hinweis{font-size:12.5px;color:var(--text-3);margin-top:12px}

.unten-nav{display:none}
@media (max-width:1180px){
  .c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .c4.feedpanel{grid-row:auto}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:16px 14px calc(84px + env(safe-area-inset-bottom))}
  .grid{gap:12px}
  .kpi .wert{font-size:22px}
  .kpi svg{display:none}
  .panel{padding:14px}
  .hide-m{display:none}
  .tab td{padding:10px 5px}.tab th{padding:0 5px 8px}
  .spiel{max-width:calc(100vw - 215px)}
  .norm{min-width:42px;padding:3px 6px;font-size:12.5px}
  .det svg{max-width:100%}
  .flag{display:none!important}
  .tab .nur-d{display:none}
  .nur-m{display:inline}
  .feedpanel{order:5}
  .det{grid-template-columns:1fr}
  .unten-nav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,19,32,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .unten-nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--text-3);padding:6px 0}
  .unten-nav button .dot{width:18px;height:4px;border-radius:2px;opacity:.35}
  .unten-nav button.an{color:var(--text)}
  .unten-nav button.an .dot{opacity:1}
  .kopf .rechts{padding:5px 10px;font-size:12px}
  .kopf h1{font-size:19px}
  .kopf .sub{display:none}
}
@media (max-width:420px){ .vbar{min-width:70px} .ringe{grid-template-columns:1fr 1fr 1fr;gap:4px} }
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><span class="logo-mark"></span>Geldradar</div>
  <div id="navliste"></div>
  <div class="aside-fuss"><div style="margin-bottom:6px">Datenstand</div><div id="quellen"></div></div>
</aside>
<main>
  <div class="kopf"><div><h1 id="titel">Übersicht</h1><div class="sub" id="untertitel"></div></div><div class="rechts"><span class="puls" id="puls"></span><span id="stand">lädt</span></div></div>
  <section class="seite an" id="s-start"></section>
  <section class="seite" id="s-betfair"></section>
  <section class="seite" id="s-pinnacle"></section>
  <section class="seite" id="s-poly"></section>
  <section class="seite" id="s-stake"></section>
  <section class="seite" id="s-hz"></section>
</main>
</div>
<nav class="unten-nav" id="untennav" aria-label="Bereiche"></nav>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TZ = "Europe/Vienna";
const uhr = iso => iso ? new Date(iso).toLocaleTimeString("de-AT",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}) : "";
const wtag = iso => new Date(iso).toLocaleDateString("de-AT",{timeZone:TZ,weekday:"short"});
const minBis = iso => Math.round((new Date(iso)-Date.now())/60000);
function wann(iso){
  if(!iso) return "";
  const m = minBis(iso);
  if(m <= 0) return "läuft";
  if(m < 60) return `in ${m} Min`;
  if(m < 12*60) return `in ${Math.floor(m/60)}:${String(m%60).padStart(2,"0")} h`;
  const heute = new Date().toLocaleDateString("de-AT",{timeZone:TZ}) === new Date(iso).toLocaleDateString("de-AT",{timeZone:TZ});
  return (heute ? "" : wtag(iso)+" ") + uhr(iso);
}
function vor(iso){
  const m = Math.round((Date.now()-new Date(iso))/60000);
  if(m < 1) return "jetzt"; if(m < 60) return `vor ${m} Min`;
  const h = Math.floor(m/60); return h < 24 ? `vor ${h} h` : `vor ${Math.floor(h/24)} T`;
}
const kurz = (v, z) => { if(v==null) return "–"; const a=Math.abs(v), s=v<0?"-":"";
  return s+z+(a>=1e6?(a/1e6).toFixed(a>=1e7?0:1).replace(".",",")+" Mio":a>=1e4?Math.round(a/1e3)+"k":a>=1e3?(a/1e3).toFixed(1).replace(".",",")+"k":Math.round(a)); };
const eur = v => kurz(v,"€"), usd = v => kurz(v,"$");
const dez = (v,n=1) => v==null ? "–" : Number(v).toFixed(n).replace(".",",");
const q2 = v => v==null ? "–" : Number(v).toFixed(2).replace(".",",");
const istRemis = n => /^(the draw|draw)/i.test(n||"");
const nm = n => istRemis(n) ? "Remis" : n;
const flagge = cc => {
  cc = String(cc||"").toLowerCase(); if(cc==="uk") cc="gb";
  return /^[a-z]{2}$/.test(cc) ? `<img class="flag" src="https://flagcdn.com/w40/${cc}.png" alt="" loading="lazy">` : `<span class="flag" style="display:grid;place-items:center;font-size:10px;color:var(--text-3)">◎</span>`;
};
const FARBE = {betfair:"var(--bf)",pinnacle:"var(--pin)",poly:"var(--poly)",stake:"var(--stake)",hz:"var(--hz)"};
const ICO = {betfair:"BF",pinnacle:"PIN",poly:"PM",stake:"ST",hz:"HZ"};
const tint = (farbe, a) => `color-mix(in srgb, ${farbe} ${a}%, transparent)`;
const icon = q => `<span class="ico" style="background:${tint(FARBE[q],16)};color:${FARBE[q]}">${ICO[q]}</span>`;

function spark(werte, farbe, w=110, h=32){
  if(!werte || werte.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const min=Math.min(...werte), max=Math.max(...werte), sp=(max-min)||1;
  const pt = werte.map((v,i)=>[i/(werte.length-1)*w, h-2-(v-min)/sp*(h-5)]);
  const d = pt.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const id = "g"+Math.random().toString(36).slice(2,8);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${farbe}" stop-opacity=".35"/><stop offset="1" stop-color="${farbe}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${farbe}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function saeulen(daten, farbe, h=170){
  if(!daten.length) return `<div class="leer">Noch kein Verlauf.</div>`;
  const W = window.innerWidth < 860 ? 360 : 640; if(W===360) daten = daten.slice(-8);
  const max = Math.max(...daten.map(d=>d.eur)) || 1, bw = (W-44)/daten.length;
  return `<svg viewBox="0 -18 ${W} ${h+42}" width="100%" role="img" aria-label="Gematchtes Geld pro Stunde">
    ${[0,.5,1].map(f=>{const y=(h-f*(h-10)).toFixed(1);return `<line x1="44" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.06)"/><text x="0" y="${(+y+4).toFixed(1)}" fill="#64718a" font-size="11" font-family="Manrope">${esc(eur(max*f))}</text>`;}).join("")}
    ${daten.map((d,i)=>{ const x=44+i*bw+bw*.18, hh=Math.max(2,d.eur/max*(h-10)), letzte=i===daten.length-1;
      return `<rect x="${x.toFixed(1)}" y="${(h-hh).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${hh.toFixed(1)}" rx="5" fill="${farbe}" opacity="${letzte?1:.5}"><title>${uhr(d.h)} Uhr: ${eur(d.eur)}</title></rect>${letzte?`<text x="${(x+bw*.64).toFixed(1)}" y="${(h-hh-7).toFixed(1)}" fill="#e9eef7" font-size="12" font-weight="800" text-anchor="end" font-family="Manrope">${esc(eur(d.eur))}</text>`:""}<text x="${(x+bw*.32).toFixed(1)}" y="${h+17}" fill="#64718a" font-size="11" text-anchor="middle" font-family="Manrope">${uhr(d.h).slice(0,2)}h</text>`;}).join("")}
  </svg>`;
}
function ring(prozent, farbe, mitte){
  const r=34, u=2*Math.PI*r, p=Math.max(0,Math.min(100,prozent||0));
  return `<svg width="86" height="86" viewBox="0 0 86 86" aria-hidden="true"><circle cx="43" cy="43" r="${r}" fill="none" stroke="var(--panel-3)" stroke-width="8"/><circle cx="43" cy="43" r="${r}" fill="none" stroke="${farbe}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(u*p/100).toFixed(1)} ${u.toFixed(1)}" transform="rotate(-90 43 43)"/><text x="43" y="48" text-anchor="middle" fill="#e9eef7" font-size="14" font-weight="800" font-family="Manrope">${esc(mitte)}</text></svg>`;
}
function farbeTeil(teile){
  const top = Math.max(...teile.filter(t=>!istRemis(t.name)).map(t=>t.wert));
  return t => istRemis(t.name) ? "var(--text-3)" : t.wert===top ? "var(--bf)" : "var(--pin)";
}
function vbar(teile){
  teile = (teile||[]).filter(t=>t.wert>0);
  const ges = teile.reduce((a,t)=>a+t.wert,0); if(!ges) return "";
  const f = farbeTeil(teile);
  return `<div class="vbar">${teile.map(t=>`<span style="flex:${t.wert} 1 0;background:${f(t)}" title="${esc(nm(t.name))} ${Math.round(t.wert/ges*100)} %"></span>`).join("")}</div>`;
}
function legende(teile, zusatz){
  teile = (teile||[]).filter(t=>t.wert>0);
  const ges = teile.reduce((a,t)=>a+t.wert,0); if(!ges) return "";
  const f = farbeTeil(teile);
  return `<div class="leg">${teile.map(t=>`<span><i style="background:${f(t)}"></i>${esc(nm(t.name))} <b>${Math.round(t.wert/ges*100)} %</b>${zusatz?" "+zusatz(t):""}</span>`).join("")}</div>`;
}
function normPill(x){
  if(x==null) return `<span class="norm" style="background:var(--panel-3);color:var(--text-3)">–</span>`;
  const f = x>=3 ? "#ff5d5d" : x>=1.5 ? "#ff9f43" : x>=1 ? "#ffd166" : "#7d8aa3";
  return `<span class="norm" style="background:${tint(f,18)};color:${f}">×${dez(x)}</span>`;
}

function statusZelle(s){
  if(s.live) return `<span class="live">${s.live.ht?"HZ":s.live.min!=null?s.live.min+"'":"live"}</span> <b>${s.live.stand?.[0]??0}:${s.live.stand?.[1]??0}</b>`;
  return `<span class="status">${wann(s.anpfiff)}</span>`;
}
function spielZeile(s, i){
  const vt = s.verteilung ? s.verteilung.map(v=>({name:v.name,wert:v.eur})) : null;
  return `<tr class="zeile" data-i="${i}" tabindex="0" aria-expanded="false">
    <td><div class="spiel">${flagge(s.land)}<div style="min-width:0"><div class="n">${esc(s.heim)} – ${esc(s.gast)}</div><div class="l"><span class="nur-m">${s.live?`<span style="color:var(--down);font-weight:700">${s.live.ht?"HZ":s.live.min!=null?s.live.min+"'":"live"} ${s.live.stand?.[0]??0}:${s.live.stand?.[1]??0}</span>`:wann(s.anpfiff)}, </span>${esc(s.liga)}</div></div></div></td>
    <td class="hide-m">${statusZelle(s)}</td>
    <td class="r"><div class="geld">${eur(s.eur)}</div>${s.d60>0?`<div class="plus">+${eur(s.d60)} in 1 h</div>`:""}</td>
    <td class="r">${normPill(s.xnorm)}</td>
    <td class="hide-m">${spark(s.kurve, "var(--bf)")}</td>
    <td class="hide-m vt">${vt?vbar(vt):`<span style="color:var(--text-3);font-size:12px;white-space:nowrap">${s.quoten.heim?`${q2(s.quoten.heim)} / ${q2(s.quoten.remis)} / ${q2(s.quoten.gast)}`:""}</span>`}</td>
  </tr>`;
}
function spielDetail(s){
  const vt = s.verteilung ? s.verteilung.map(v=>({name:v.name,wert:v.eur,quote:v.quote})) : null;
  return `<tr class="detail"><td colspan="6"><div class="det">
    <div><h4>Geld im Verlauf, letzte 10 Stunden</h4>${spark(s.kurve,"var(--bf)",320,70)}
      <div class="mini-liste" style="margin-top:8px"><div><span>Jetzt gematcht</span><b>${eur(s.eur)}</b></div>
      <div><span>Üblich in dieser Liga und Phase</span><b>${s.normEur?eur(s.normEur):"unbekannt"}</b></div>
      ${s.d60!=null?`<div><span>Letzte 60 Minuten</span><b>+${eur(Math.max(0,s.d60))}</b></div>`:""}</div></div>
    <div><h4>Sieg-Markt</h4>${vt?vbar(vt)+legende(vt, t=>"zu "+q2(t.quote)):`<div class="mini-liste"><div><span>${esc(s.heim)}</span><b>${q2(s.quoten.heim)}</b></div><div><span>Remis</span><b>${q2(s.quoten.remis)}</b></div><div><span>${esc(s.gast)}</span><b>${q2(s.quoten.gast)}</b></div></div>`}
      ${s.wahrsch?`<div style="margin-top:10px;color:var(--text-3);font-size:12px">Faire Wahrscheinlichkeit ${Math.round(s.wahrsch.heim*100)} / ${Math.round(s.wahrsch.remis*100)} / ${Math.round(s.wahrsch.gast*100)} %</div>`:""}</div>
    <div><h4>Wo das Geld liegt</h4><div class="mini-liste">${(s.maerkte||[]).map(m=>`<div><span>${esc(m.name)}</span><b>${eur(m.eur)}</b></div>`).join("")||"–"}</div></div>
  </div></td></tr>`;
}
function spielTabelle(liste, id, max, mitVt=true){
  if(!liste.length) return `<div class="leer">Keine Spiele in dieser Auswahl.</div>`;
  return `<div class="tw"><table class="tab${mitVt?"":" ohne-vt"}" id="${id}"><thead><tr><th>Spiel</th><th class="hide-m">Anpfiff</th><th class="r">Geld</th><th class="r">Norm</th><th class="hide-m">Verlauf</th><th class="hide-m vt">Verteilung</th></tr></thead>
    <tbody>${liste.slice(0,max).map((s,i)=>spielZeile(s,i)).join("")}</tbody></table></div>
    ${liste.length>max?`<button class="mehr" data-mehr="${id}">Alle ${liste.length} Spiele zeigen</button>`:""}`;
}

// ── alle Pushes einer Quelle in einer Liste ─────────────────────────
const tagFuer = s => s==="won"?`<span class="tag t-won">gewonnen</span>`:s==="lost"?`<span class="tag t-lost">verloren</span>`:s==="pending"?`<span class="tag t-open">offen</span>`:"";
const statusTag = s => s==="won"?`<span class="tag t-won">gewonnen</span>`:s==="lost"?`<span class="tag t-lost">verloren</span>`:"";
const stakeStatus = x => x.status==="abgerechnet"&&x.rendite!=null ? (x.rendite>0?"won":"lost") : "pending";
function allePushes(D){
  const f = [];
  for(const p of D.bfPushes.liste) f.push({q:"betfair", t:`${p.auf} @ ${q2(p.quote)}`, s:`${p.heim} – ${p.gast}, ${p.liga}, ${p.anteil} % des Geldes`, b:eur(p.eur), zeit:p.zeit, status:p.status});
  for(const w of D.poly.walPushes||[]) f.push({q:"poly", t:`Wal auf ${nm(w.seite)} @ ${Math.round((w.preis||0)*100)} ¢`, s:`${w.liga||"Polymarket"}, ${String(w.markt||"").replace(/-\d{4}-\d{2}-\d{2}.*$/,"").split("-").slice(1).join(" – ").toUpperCase()}`, b:usd(w.usd), zeit:w.zeit, status:w.status});
  for(const x of D.stake.gruppen||[]) f.push({q:"stake", t:`${x.auswahl}${x.quote?" @ "+q2(x.quote):""}`, s:`${x.spiel}, ${x.arten.join(" + ")}`, b:usd(x.usd), zeit:x.zeit, status:stakeStatus(x)});
  for(const h of D.hz.heute) f.push({q:"hz", t:`0:0 zur Pause, Tor 2. HZ @ ${q2(h.quoten?.over05)}`, s:`${h.spiel}, ${h.liga}`, b:"0:0", zeit:h.zeit});
  return f.sort((a,b)=>new Date(b.zeit)-new Date(a.zeit));
}
const feZeile = x => `<div class="fe">${icon(x.q)}<div style="min-width:0"><div class="t">${esc(x.t)}${statusTag(x.status)}</div><div class="s">${esc(x.s)}</div></div><div class="b">${esc(x.b)}<small>${x.zeit?vor(x.zeit):""}</small></div></div>`;
function feedListe(D, n=12){
  const f = allePushes(D);
  for(const s of D.sharp.filter(s=>s.frisch||s.laeuftNoch)) f.push({q:"pinnacle", t:`${s.auf}: Quote ${q2(s.vonQuote)} → ${q2(s.fairQuote)}`, s:`${s.heim} – ${s.gast}`, b:q2(s.fairQuote), zeit:D.quellen.pinnacle});
  f.sort((a,b)=>new Date(b.zeit)-new Date(a.zeit));
  const je = {}, aus = [];
  for(const x of f){ je[x.q]=(je[x.q]||0)+1; if(je[x.q]>4) continue; aus.push(x); }
  return aus.slice(0,n).map(feZeile).join("") || `<div class="leer">Noch nichts passiert.</div>`;
}
let filterPush = "alle";
function pushPanel(D){
  const alle = allePushes(D), quellen = [["alle","Alle"],["betfair","Betfair"],["poly","Polymarket"],["stake","Stake"],["hz","HZ 0:0"]];
  const liste = filterPush==="alle" ? alle : alle.filter(x=>x.q===filterPush);
  return `<div class="ph"><h3>Pushes</h3><span class="hint">was in die Channels ging, mit Ergebnis</span>
    <div class="chips rechts">${quellen.map(([k,n])=>`<button class="chip${k===filterPush?" an":""}" data-push="${k}">${n} <span style="opacity:.6">${k==="alle"?alle.length:alle.filter(x=>x.q===k).length}</span></button>`).join("")}</div></div>
    <div class="push-raster">${liste.slice(0,24).map(feZeile).join("") || `<div class="leer">Keine Pushes.</div>`}</div>`;
}

// ── Frischer Zufluss ────────────────────────────────────────────────
function zuflussListe(D, gross){
  const z = D.betfair.zufluss;
  if(!z.length) return `<div class="leer">Gerade kein frischer Zufluss über der Schwelle. Sobald irgendwo dick Geld reinkommt, steht es hier.</div>`;
  return `<div class="zufluss">${z.map(x=>{
    const vt = x.verteilung ? x.verteilung.map(v=>({name:v.name,wert:v.eur,quote:v.quote})) : null;
    const richtung = x.quoteRichtung==="faellt" ? `<span style="color:var(--up)">Quote fällt</span>` : x.quoteRichtung==="steigt" ? `<span style="color:var(--down)">Quote steigt</span>` : "Quote ruhig";
    return `<div class="zf"><div class="zf-kopf"><div class="spiel">${flagge(x.land)}<div style="min-width:0"><div class="n">${esc(x.heim)} – ${esc(x.gast)}</div><div class="l">${wann(x.anpfiff)}, ${esc(x.liga)}</div></div></div>
      <div class="zf-betrag">+${eur(x.zuflussEur)}<small>von ${eur(x.marktEur)} im Markt</small></div></div>
      <div class="zf-auf">Auf <b>${esc(nm(x.meistesGeldAuf))}</b> @ <b>${q2(x.quote)}</b>, ${richtung}${x.pinnacle?`, Pinnacle ${x.pinnacle.einig?`<span style="color:var(--up)">einig</span>`:`<span style="color:var(--down)">anderer Meinung</span>`}`:""}${x.markt!=="Match Odds"?`, Markt ${esc(x.markt)}`:""}${x.duenn?", dünner Markt":""}</div>
      ${gross&&vt?vbar(vt)+legende(vt,t=>"@ "+q2(t.quote)):""}</div>`;}).join("")}</div>`;
}

let D = null, filterBf = "norm";
const belegt = m => (m.wale||[]).some(w=>w.bewiesen);
function seiteStart(D){
  const r = D.radar, top = r.spiele.filter(s=>s.xnorm!=null).slice(0,8);
  const pb = D.bfPushes.bilanz, burst = D.stake.bilanz?.Burst, hz = (D.hz.bericht||[]).find(b=>/Heim/.test(b.wette)) || (D.hz.bericht||[])[0];
  return `<div class="grid">
    <div class="panel c8"><div class="ph"><h3>Frischer Zufluss</h3><span class="hint">wo seit dem letzten Abruf dick Geld reinkam</span><button class="chip rechts" data-geh="betfair">Betfair</button></div>${zuflussListe(D,true)}</div>
    <div class="panel c4 feedpanel" style="grid-row:span 2"><div class="ph"><h3>Live-Feed</h3><span class="hint">alles durcheinander, neueste zuerst</span></div><div class="feed">${feedListe(D,13)}</div></div>
    <div class="panel c8"><div class="ph"><h3>Ungewöhnlich viel Geld</h3><span class="hint">gemessen an der eigenen Liga</span><button class="chip rechts" data-geh="betfair">Alle ${r.spiele.length} Spiele</button></div>${spielTabelle(top,"t-start",8,false)}</div>
    <div class="panel c8"><div class="ph"><h3>Pinnacle bewegt sich</h3><span class="hint">faire Quote ohne Marge, vorher und jetzt</span><button class="chip rechts" data-geh="pinnacle">Alle Pinnacle-Spiele</button></div>${pinKarten(D.sharp.slice(0,6))}</div>
    <div class="panel c4"><div class="ph"><h3>Bilanz der Signale</h3></div><div class="ringe">
      <div class="ring">${ring(pb.treffer,"#ffb547",(pb.roi>0?"+":"")+dez(pb.roi)+"%")}<div class="w"><b>Betfair-Pushes</b>${pb.n} Tipps<br>${dez(pb.treffer,0)} % Treffer</div></div>
      ${burst?`<div class="ring">${ring(burst.treffer,"#2fd38a",(burst.roi>0?"+":"")+dez(burst.roi)+"%")}<div class="w"><b>Stake-Burst</b>${burst.n} Tipps<br>${burst.treffer} % Treffer</div></div>`:""}
      ${hz?`<div class="ring">${ring(hz.treffer,"#ff77a8",(hz.roi>0?"+":"")+dez(hz.roi)+"%")}<div class="w"><b>HZ 0:0 ${esc(hz.wette.replace(/ \(.*\)/,""))}</b>${hz.n} Spiele<br>${dez(hz.treffer,0)} % Treffer</div></div>`:""}
    </div><div class="hinweis">Mitte: Rendite pro Tipp, Ring: Trefferquote. Betfair = Public-Channel seit 31.07., zur Quote beim Push, ohne Kommission. Stake = zur Quote der Großwetter. HZ = Betfair-Quote zur Pause, mit 2 % Kommission. Statistisch belegt ist noch keine.</div></div>
    <div class="panel c12"><div class="ph"><h3>Polymarket</h3><span class="hint">Märkte mit belegten Wallets zuerst</span><button class="chip rechts" data-geh="poly">Alle Märkte und Wallets</button></div>${polyTabelle(D.poly.maerkte.filter(belegt).concat(D.poly.maerkte.filter(m=>!belegt(m))).slice(0,6),"p-start")}</div>
    <div class="panel c12" id="pushpanel">${pushPanel(D)}</div>
  </div>`;
}
const BF_SETS = {
  norm: ["Über Norm", a=>a.filter(s=>s.xnorm>=1)],
  live: ["Live", a=>a.filter(s=>s.live).sort((x,y)=>y.eur-x.eur)],
  zufluss: ["Zufluss 1 h", a=>a.filter(s=>s.d60>0).sort((x,y)=>y.d60-x.d60)],
  klein: ["Kleine Ligen", a=>a.filter(s=>(s.normEur||0) < 60000 && s.xnorm!=null)],
  alle: ["Alle", a=>a.slice().sort((x,y)=>y.eur-x.eur)],
};
const HZNAME = {"Half Time":"HZ-Sieger","First Half Goals 0.5":"HZ Tore 0,5","First Half Goals 1.5":"HZ Tore 1,5","First Half Goals 2.5":"HZ Tore 2,5","Half Time Score":"HZ-Ergebnis"};
const hzAuswahl = n => String(n||"").replace(/^The Draw$/,"Remis").replace(" Goals","");
function hzTabelle(liste, id){
  if(!liste.length) return `<div class="leer">Gerade kein nennenswertes Geld auf die erste Halbzeit.</div>`;
  TL[id] = liste;
  return `<div class="tw"><table class="tab" id="${id}"><thead><tr><th>Spiel</th><th class="hide-m">Anpfiff</th><th class="r">HZ-Geld</th><th>Meistes Geld auf</th><th class="r hide-m">HZ zu Spiel</th></tr></thead><tbody>
  ${liste.map((g,i)=>{ const t = g.maerkte[0];
    return `<tr class="zeile" data-i="${i}" data-art="hz" tabindex="0" aria-expanded="false"><td><div class="spiel">${flagge(g.land)}<div style="min-width:0"><div class="n">${esc(g.heim)} – ${esc(g.gast)}</div><div class="l"><span class="nur-m">${g.live?`<span style="color:var(--down);font-weight:700">${g.live.min!=null?g.live.min+"'":"live"} ${g.live.stand?.[0]??0}:${g.live.stand?.[1]??0}</span>`:wann(g.anpfiff)}, </span>${esc(g.liga)}</div></div></div></td>
      <td class="hide-m">${g.live?`<span class="live">${g.live.min!=null?g.live.min+"'":"live"}</span> <b>${g.live.stand?.[0]??0}:${g.live.stand?.[1]??0}</b>`:`<span class="status">${wann(g.anpfiff)}</span>`}</td>
      <td class="r"><div class="geld">${eur(g.eur)}</div></td>
      <td>${t?`<div style="font-weight:700">${esc(hzAuswahl(t.auf))} @ ${q2(t.quote)} <span style="color:var(--text-2);font-weight:600">${t.anteil} %</span></div><div style="font-size:12px;color:var(--text-3)">${HZNAME[t.name]||esc(t.name)}, ${eur(t.eur)}</div>`:""}</td>
      <td class="r hide-m">${g.htZuMo==null?"–":g.htZuMo>=1?`<span class="norm" style="background:${tint("#ff5d5d",18)};color:#ff5d5d">×${dez(g.htZuMo)} Fix?</span>`:`<span class="status">${Math.round(g.htZuMo*100)} %</span>`}</td></tr>`;}).join("")}
  </tbody></table></div>`;
}
function hzDetail(g){
  return `<tr class="detail"><td colspan="5"><div class="det">${g.maerkte.slice(0,3).map(m=>{ const t = m.runner.map(r=>({name:hzAuswahl(r.name),wert:r.eur,quote:r.quote}));
    return `<div><h4>${HZNAME[m.name]||esc(m.name)}, ${eur(m.eur)}</h4>${vbar(t)}${legende(t,x=>"@ "+q2(x.quote))}</div>`;}).join("")}</div>
    <div class="hinweis">Spiel-Sieg-Markt: ${eur(g.moEur)} gematcht. Liegt auf dem HZ-Sieger mehr Geld als auf dem Spiel-Sieger, ist das ungewöhnlich.</div></td></tr>`;
}
function seiteBetfair(D){
  const alle = D.radar.spiele, liste = BF_SETS[filterBf][1](alle);
  return `<div class="grid">
    <div class="panel c12"><div class="ph"><h3>Frischer Zufluss</h3><span class="hint">wo seit dem letzten Abruf dick Geld reinkam, mit Verteilung</span></div>${zuflussListe(D,true)}</div>
    <div class="panel c12"><div class="ph"><h3>Halbzeit-Geld</h3><span class="hint">Geld auf die erste Halbzeit, vor Anpfiff und solange sie läuft; entschiedene Tormärkte sind raus</span></div>${hzTabelle(D.halbzeit||[],"hz-bf")}</div>
    <div class="panel c12"><div class="ph"><h3>Alle Spiele auf Betfair</h3><span class="hint">${alle.length} Spiele aus ${D.radar.ligen} Ligen, live und nächste 30 Stunden</span>
      <div class="chips rechts">${Object.entries(BF_SETS).map(([k,[n,fn]])=>`<button class="chip${k===filterBf?" an":""}" data-filter="${k}">${n} <span style="opacity:.6">${fn(alle).length}</span></button>`).join("")}</div></div>
      ${spielTabelle(liste,"t-bf",25)}
      <div class="hinweis">Norm ist das gematchte Geld jetzt, geteilt durch das, was in dieser Liga in derselben Spielphase üblich ist (Median der letzten 60 Tage). ×2 heißt doppelt so viel wie sonst. Zeile antippen für Verlauf, Märkte und Quoten.</div></div>
  </div>`;
}
function pinKarten(liste){
  if(!liste.length) return `<div class="leer">Gerade bewegt sich keine Pinnacle-Quote deutlich.</div>`;
  return `<div class="karten">${liste.map(s=>{
    const lab = s.art==="lauf" ? (s.laeuftNoch?["läuft noch","t-won"]:["Lauf steht","t-open"]) : (s.frisch?["frischer Sprung","t-lost"]:["eingepreist","t-open"]);
    return `<div class="karte"><div class="k1"><div style="min-width:0"><div class="auf">${esc(s.auf)}</div><div class="sp">${esc(s.heim)} – ${esc(s.gast)}, ${wann(s.anpfiff)}</div></div><span class="tag ${lab[1]}">${lab[0]}</span></div>
      <div class="quoten-zug"><span class="alt">${q2(s.vonQuote)}</span><span class="pfeil">→</span><span class="neu">${q2(s.fairQuote)}</span></div>
      ${spark(s.verlauf,"#5b9dff",200,34)}
      <div class="unten"><span>Wahrscheinlichkeit ${dez(s.vonPct)} → ${dez(s.nachPct)} %</span></div>
      <div class="unten"><span>${s.betfairGeld?`Betfair-Geld: <span style="color:${s.betfairGeld.auf===s.auf?"var(--up)":"var(--down)"}">${s.betfairGeld.anteil} % auf ${esc(nm(s.betfairGeld.auf))}</span>`:""}</span><span>${s.betfairGeld&&s.betfairGeld.auf===s.auf&&s.betfairGeld.quote?`BF ${q2(s.betfairGeld.quote)}`:""}</span></div></div>`;}).join("")}</div>`;
}
function quoteZelle(a){
  const d = a.vorher && a.quote ? a.quote - a.vorher : 0;
  const f = Math.abs(d) < 0.03 ? "var(--text)" : d < 0 ? "var(--up)" : "var(--down)";
  return `<td class="r"><div style="font-weight:800;color:${f}">${q2(a.quote)}</div>${Math.abs(d)>=0.03?`<div style="font-size:11.5px;color:var(--text-3)">vorher ${q2(a.vorher)}</div>`:""}</td>`;
}
function pinTabelle(liste, id){
  if(!liste.length) return `<div class="leer">Keine Spiele mit Pinnacle-Quote im Fenster.</div>`;
  TL[id] = liste;
  return `<div class="tw"><table class="tab" id="${id}"><thead><tr><th>Spiel</th><th class="hide-m">Anpfiff</th><th class="r">1</th><th class="r">X</th><th class="r">2</th><th class="hide-m">Betfair-Geld</th><th class="r hide-m">Pinnacle / Buchmacher</th></tr></thead><tbody>
  ${liste.map((g,i)=>`<tr class="zeile" data-i="${i}" data-art="pinn" tabindex="0" aria-expanded="false"><td><div class="spiel">${flagge(g.land)}<div style="min-width:0"><div class="n">${esc(g.heim)} – ${esc(g.gast)}</div><div class="l"><span class="nur-m">${g.live?"live":wann(g.anpfiff)}, </span>${esc(g.liga)}</div></div></div></td>
    <td class="hide-m">${g.live?`<span class="live">live</span>`:`<span class="status">${wann(g.anpfiff)}</span>`}</td>
    ${g.ausgaenge.map(quoteZelle).join("")}
    <td class="hide-m">${g.geld?`<div style="font-weight:700;white-space:nowrap">${g.geld.anteil} % auf ${esc(nm(g.geld.auf))}</div><div style="font-size:11.5px;color:var(--text-3)">${eur(g.geld.eur)} gematcht, ${g.einig?`<span style="color:var(--up)">Pinnacle einig</span>`:`<span style="color:var(--down)">Pinnacle anders</span>`}</div>`:""}</td>
    <td class="r hide-m">${g.geld&&g.geld.pinnacle?`<div style="font-weight:700;white-space:nowrap">${q2(g.geld.pinnacle)} / ${q2(g.geld.buchmacher)}</div><div style="font-size:11.5px;color:var(--text-3)">auf ${esc(nm(g.geld.auf))}</div>`:""}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function pinDetail(g){
  const farben = ["#ffb547","#7d8aa3","#5b9dff"];
  const kurven = g.ausgaenge.filter(a=>a.kurve.length>1);
  let chart = "";
  if(kurven.length){
    const alleW = kurven.flatMap(a=>a.kurve), min=Math.min(...alleW), max=Math.max(...alleW), sp=(max-min)||1, W=320, H=90;
    chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" aria-hidden="true">${g.ausgaenge.map((a,i)=>a.kurve.length>1?`<polyline fill="none" stroke="${farben[i]}" stroke-width="2" vector-effect="non-scaling-stroke" points="${a.kurve.map((v,j)=>`${(j/(a.kurve.length-1)*W).toFixed(1)},${(H-4-(v-min)/sp*(H-8)).toFixed(1)}`).join(" ")}"/>`:"").join("")}</svg>`;
  }
  return `<tr class="detail"><td colspan="7"><div class="det">
    <div><h4>Pinnacle-Wahrscheinlichkeit im Verlauf</h4>${chart||"–"}<div class="leg">${g.ausgaenge.map((a,i)=>`<span><i style="background:${farben[i]}"></i>${esc(a.name)} <b>${q2(a.vorher)} → ${q2(a.quote)}</b></span>`).join("")}</div></div>
    <div><h4>Quoten auf ${g.geld?esc(nm(g.geld.auf)):"die Geldseite"}</h4>${g.geld?`<div class="mini-liste"><div><span>Pinnacle</span><b>${q2(g.geld.pinnacle)}</b></div><div><span>Betfair</span><b>${q2(g.geld.betfair)}</b></div><div><span>Buchmacher-Schnitt (${g.geld.nBuecher||"?"})</span><b>${q2(g.geld.buchmacher)}</b></div><div><span>Polymarket</span><b>${q2(g.geld.poly)}</b></div></div>`:"–"}</div>
    <div><h4>Betfair-Geld</h4>${g.geld?`<div class="mini-liste"><div><span>Gematcht</span><b>${eur(g.geld.eur)}</b></div><div><span>Anteil auf ${esc(nm(g.geld.auf))}</span><b>${g.geld.anteil} %</b></div><div><span>Pinnacle-Favorit gleich?</span><b style="color:${g.einig?"var(--up)":"var(--down)"}">${g.einig?"ja":"nein"}</b></div></div>`:"–"}</div>
  </div></td></tr>`;
}
function seitePinnacle(D){
  return `<div class="grid">
    <div class="panel c12"><div class="ph"><h3>Deutliche Bewegungen</h3><span class="hint">faire Quote ohne Marge, vom ersten Abruf bis jetzt</span></div>${pinKarten(D.sharp)}</div>
    <div class="panel c12"><div class="ph"><h3>Alle Spiele mit Pinnacle-Quote</h3><span class="hint">${D.pinnAlle.length} Spiele, faire Quoten 1 / X / 2, grün = Quote gefallen, rot = gestiegen</span></div>${pinTabelle(D.pinnAlle,"pin-alle")}
    <div class="hinweis">Zeile antippen für den Verlauf und den Vergleich Pinnacle, Betfair, Buchmacher-Schnitt und Polymarket.</div></div>
  </div>`;
}

const TL = {};
const seiteName = n => /^draw/i.test(n) ? "Remis" : n;
function polyDetail(m){
  const ws = {}; for(const w of D.poly.wallets) ws[w.wallet] = w;
  const teile = m.geld ? Object.entries(m.geld).map(([n,v])=>({name:seiteName(n), wert:v, preis:m.preise?.[n]})) : [];
  const ges = teile.reduce((a,t)=>a+t.wert,0);
  return `<tr class="detail"><td colspan="5"><div class="det">
    <div><h4>Geld je Seite</h4>${teile.length?vbar(teile)+legende(teile, t=>usd(t.wert)):"–"}
      <div class="mini-liste" style="margin-top:10px"><div><span>Volumen gesamt</span><b>${usd(m.usd)}</b></div><div><span>davon in offenen Positionen</span><b>${usd(ges)}</b></div></div></div>
    <div><h4>Preis je Seite</h4><div class="mini-liste">${Object.entries(m.preise||{}).map(([n,v])=>`<div><span>${esc(seiteName(n))}</span><b>${Math.round(v*100)} ¢ <span style="color:var(--text-3);font-weight:600">= Quote ${v>0?q2(1/v):"–"}</span></b></div>`).join("")||"–"}</div>
      <div style="margin-top:12px"><a href="https://polymarket.com/event/${encodeURIComponent(m.key)}" target="_blank" rel="noopener" class="chip" style="text-decoration:none;display:inline-block">Markt auf Polymarket öffnen</a></div></div>
    <div><h4>Größte Halter</h4><div class="mini-liste">${(m.wale||[]).slice(0,6).map(w=>{ const t = ws[w.wallet];
      return `<div><span><a href="https://polymarket.com/profile/${encodeURIComponent(w.wallet)}" target="_blank" rel="noopener">${esc(w.wallet.slice(0,6))}…${esc(w.wallet.slice(-4))}</a>${w.bewiesen?` <span class="tag" style="background:${tint("var(--poly)",18)};color:var(--poly)">belegt${t?` +${dez(t.fensterClv)} pp`:""}</span>`:""}<br><span style="color:var(--text-3);font-size:12px">auf ${esc(seiteName(w.seite))}</span></span><b>${usd(w.usd)}</b></div>`;}).join("")||"–"}</div></div>
  </div></td></tr>`;
}
function polyTabelle(liste, id){
  if(!liste.length) return `<div class="leer">Keine Märkte im Fenster.</div>`;
  TL[id] = liste;
  const zeilen = liste.map((m,i)=>{
    const bew = (m.wale||[]).filter(w=>w.bewiesen);
    const teile = m.geld ? Object.entries(m.geld).map(([n,v])=>({name:/^draw/i.test(n)?"Draw":n, wert:v})) : [];
    const top = (m.wale||[])[0];
    return `<tr class="zeile" data-i="${i}" data-art="poly" tabindex="0" aria-expanded="false"><td><div class="spiel"><span class="flag" style="display:grid;place-items:center;background:${tint("var(--poly)",18)};color:var(--poly);font-size:9px;font-weight:800">PM</span><div style="min-width:0"><div class="n"><a href="https://polymarket.com/event/${encodeURIComponent(m.key)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(m.spiel)}</a></div><div class="l"><span class="nur-m">${wann(m.anpfiff)}, </span>${esc(m.liga||m.sport||"")}${bew.length?`<span class="nur-m" style="color:var(--poly);font-weight:700">, ${bew.length} belegt</span>`:""}</div></div></div></td>
      <td class="hide-m"><span class="status">${wann(m.anpfiff)}</span></td>
      <td class="r"><div class="geld">${usd(m.usd)}</div></td>
      <td class="hide-m">${teile.length?vbar(teile):""}</td>
      <td class="hide-m">${top?`<div style="font-weight:700;white-space:nowrap">${usd(top.usd)} <span style="color:var(--text-2);font-weight:600">auf ${esc(nm(/^draw/i.test(top.seite)?"Draw":top.seite))}</span></div><div style="font-size:12px;color:var(--text-3)">${bew.length?`<span style="color:var(--poly);font-weight:700">${bew.length} belegte Wallet${bew.length>1?"s":""}</span>`:"größter Halter"}</div>`:""}</td></tr>`;
  }).join("");
  return `<div class="tw"><table class="tab" id="${id}"><thead><tr><th>Markt</th><th class="hide-m">Anpfiff</th><th class="r">Volumen</th><th class="hide-m">Geld je Seite</th><th class="hide-m">Größte Position</th></tr></thead><tbody>${zeilen}</tbody></table></div>`;
}
function seitePoly(D){
  const p = D.poly;
  return `<div class="grid">
    <div class="panel c12"><div class="ph"><h3>Märkte, nächste 30 Stunden</h3><span class="hint">mit belegten Wallets zuerst</span></div>${polyTabelle(p.maerkte.filter(belegt).concat(p.maerkte.filter(m=>!belegt(m))),"p-alle")}</div>
    <div class="panel c12"><div class="ph"><h3>Wallets, die den Schlusskurs schlagen</h3><span class="hint">gereiht nach der vorsichtigen Untergrenze, nicht nach Größe</span></div>
    <div class="tw"><table class="tab"><thead><tr><th>Wallet</th><th class="hide-m">Sport</th><th class="r">Vorsprung</th><th class="r hide-m">Wetten</th><th class="r hide-m">Schnitt</th><th class="r hide-m">Bilanz</th><th>Jetzt drin</th></tr></thead><tbody>
    ${p.wallets.map(w=>`<tr><td><a href="https://polymarket.com/profile/${encodeURIComponent(w.wallet)}" target="_blank" rel="noopener" style="font-weight:700;text-decoration:none">${esc(w.wallet.slice(0,6))}…${esc(w.wallet.slice(-4))}</a></td><td class="hide-m"><span class="status">${esc(w.sport)}</span></td>
      <td class="r"><b style="color:var(--poly)">+${dez(w.fensterClv)} pp</b><div style="font-size:11.5px;color:var(--text-3)">mind. +${dez(w.clvUg)}</div></td><td class="r hide-m">${w.fensterN}</td><td class="r hide-m">${usd(w.schnittUsd)}</td>
      <td class="r hide-m" style="font-weight:700;color:${w.pnl>=0?"var(--up)":"var(--down)"}">${usd(w.pnl)}</td>
      <td>${w.offen.length?w.offen.map(o=>`<div><b>${usd(o.usd)}</b> auf ${esc(nm(o.seite))} <span style="color:var(--text-3)">${wann(o.anpfiff)}</span></div>`).join(""):`<span style="color:var(--text-3)">nichts offen</span>`}</td></tr>`).join("")}
    </tbody></table></div></div></div>`;
}
function seiteStake(D){
  const st = D.stake, gr = st.gruppen || [];
  return `<div class="grid">
    ${Object.entries(st.bilanz||{}).map(([a,b])=>`<div class="panel kpi c3"><div class="lab">${icon("stake")}${esc(a)}</div><div class="wert" style="color:${b.roi>0?"var(--up)":"var(--down)"}">${b.roi>0?"+":""}${dez(b.roi)} %</div><div class="neben">${b.n} abgerechnet, ${b.treffer} % Treffer, ${b.ug>0?"belegt":"nicht belegt"}</div></div>`).join("")}
    <div class="panel c12"><div class="ph"><h3>Große Wetten, letzte 24 Stunden</h3><span class="hint">je Spiel und Auswahl zusammengefasst, Betrag = größte Serie</span></div>
    <div class="tw"><table class="tab"><thead><tr><th>Auswahl</th><th class="hide-m">Signale</th><th class="hide-m">Wann</th><th class="r">Einsatz</th><th class="r hide-m">Quote</th><th class="r">Ergebnis</th></tr></thead><tbody>
    ${gr.map(x=>`<tr><td><div class="spiel"><div style="min-width:0"><div class="n">${esc(x.auswahl)}${x.signale>1?` <span class="tag t-open">${x.signale}×</span>`:""}</div><div class="l"><span class="nur-m">${x.phase==="live"?"live":"vorher"} ${uhr(x.zeit)}, ${esc(x.arten.join(" + "))}, </span>${esc(x.spiel)}, ${esc(x.liga)}${x.markt?", "+esc(x.markt):""}</div></div></div></td>
      <td class="hide-m">${x.arten.map(a=>`<span class="tag t-open" style="margin:0 4px 0 0">${esc(a)}</span>`).join("")}</td>
      <td class="hide-m">${x.phase==="live"?`<span class="live">live</span>`:`<span class="status">vorher</span>`} <span class="status">${uhr(x.zeit)}</span></td>
      <td class="r"><div class="geld">${usd(x.usd)}</div><div style="font-size:11.5px;color:var(--text-3);white-space:nowrap">${x.wetten} Wetten${x.faktor?`, ×${dez(x.faktor)}`:""}</div></td><td class="r hide-m">${q2(x.quote)}</td>
      <td class="r">${tagFuer(stakeStatus(x))}</td></tr>`).join("")}
    </tbody></table></div></div></div>`;
}
function seiteHz(D){
  const z = D.hz, nm2 = {over05:"Tor 2. HZ", over15:"2+ Tore", heim:"Heimsieg"};
  return `<div class="grid">
    ${(z.bericht||[]).map(b=>`<div class="panel kpi c4"><div class="lab">${icon("hz")}${esc(b.wette)}</div><div class="wert" style="color:${b.roi>0?"var(--up)":"var(--down)"}">${b.roi>0?"+":""}${dez(b.roi)} %</div><div class="neben">${b.n} Spiele, getroffen ${dez(b.treffer)} % bei erwarteten ${dez(b.erwartet)} %</div></div>`).join("")}
    <div class="panel c12"><div class="ph"><h3>Zur Pause 0:0</h3><span class="hint">Spiele, in denen vorher Tore oder ein klarer Favorit erwartet war</span></div>
    <table class="tab"><thead><tr><th>Spiel</th><th class="hide-m">Erkannt</th>${Object.entries(nm2).map(([k,n])=>`<th class="r${k==="over15"?" hide-m":""}">${n}</th>`).join("")}</tr></thead><tbody>
    ${z.heute.map(e=>`<tr><td><div class="spiel">${flagge(e.land)}<div style="min-width:0"><div class="n">${esc(e.spiel)}</div><div class="l"><span class="nur-m">${uhr(e.zeit)}, </span>${esc(e.liga)}</div></div></div></td><td class="hide-m"><span class="status">${uhr(e.zeit)}</span></td>${Object.keys(nm2).map(k=>`<td class="r${k==="over15"?" hide-m":""}" style="font-weight:700">${q2(e.quoten?.[k])}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div></div>`;
}

const SEITEN = [["start","Übersicht","var(--text)"],["betfair","Betfair","var(--bf)"],["pinnacle","Pinnacle","var(--pin)"],
  ["poly","Polymarket","var(--poly)"],["stake","Stake","var(--stake)"],["hz","HZ 0:0","var(--hz)"]];
const UNTER = {start:"Wo gerade das Geld liegt, quer über alle Quellen", betfair:"Jedes Spiel im Abruf, gemessen an seiner Liga", pinnacle:"Wohin die schärfste Quote zieht", poly:"Wer setzt, und wer davon nachweislich gut ist", stake:"Serien großer Einsätze", hz:"Spiele, die zur Pause anders laufen als erwartet"};
let aktiv = "start";
function navAufbauen(z){
  $("#navliste").innerHTML = SEITEN.map(([k,n,f])=>`<button class="nav${k===aktiv?" an":""}" data-geh="${k}"><span class="dot" style="background:${f}"></span>${n}${z[k]?`<span class="cnt">${z[k]}</span>`:""}</button>`).join("");
  $("#untennav").innerHTML = SEITEN.map(([k,n,f])=>`<button class="${k===aktiv?"an":""}" data-geh="${k}"><span class="dot" style="background:${f}"></span>${n.replace("Polymarket","Poly").replace("Übersicht","Start")}</button>`).join("");
}
function gehe(k){
  aktiv = k;
  document.querySelectorAll(".seite").forEach(s=>s.classList.toggle("an", s.id==="s-"+k));
  document.querySelectorAll("#navliste [data-geh], #untennav [data-geh]").forEach(b=>b.classList.toggle("an", b.dataset.geh===k));
  $("#titel").textContent = SEITEN.find(s=>s[0]===k)[1];
  $("#untertitel").textContent = UNTER[k];
  try{ localStorage.setItem("radar-seite2", k); }catch(_){}
}
function render(){
  $("#s-start").innerHTML = seiteStart(D);
  $("#s-betfair").innerHTML = seiteBetfair(D);
  $("#s-pinnacle").innerHTML = seitePinnacle(D);
  $("#s-poly").innerHTML = seitePoly(D);
  $("#s-stake").innerHTML = seiteStake(D);
  $("#s-hz").innerHTML = seiteHz(D);
  navAufbauen({betfair:D.radar.spiele.filter(s=>s.xnorm>=1.5).length, pinnacle:D.sharp.filter(s=>s.frisch||s.laeuftNoch).length,
    poly:D.poly.maerkte.filter(belegt).length, stake:(D.stake.gruppen||D.stake.heute).length, hz:D.hz.heute.length});
  gehe(aktiv);
}
function quellen(q){
  const n = {betfair:"Betfair",pinnacle:"Pinnacle",polymarket:"Polymarket",stake:"Stake",hz:"HZ-Finder"};
  let schlecht = 0;
  $("#quellen").innerHTML = Object.entries(n).map(([k,t])=>{
    const gut = k==="polymarket" ? 90 : 35, m = q[k] ? (Date.now()-new Date(q[k]))/60000 : 1e9, st = m<=gut?0:m<=gut*3?1:2; schlecht=Math.max(schlecht,st);
    return `<div class="q"><i style="background:${["var(--up)","var(--bf)","var(--down)"][st]}"></i>${t}<span style="margin-left:auto;color:var(--text-3)">${q[k]?vor(q[k]):"–"}</span></div>`;}).join("");
  $("#puls").style.background = ["var(--up)","var(--bf)","var(--down)"][schlecht];
}
async function laden(){
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    D = await r.json();
    $("#stand").textContent = "Stand " + uhr(D.generatedAt);
    quellen(D.quellen||{});
    render();
  }catch(e){ console.error(e); $("#stand").textContent = "Daten nicht erreichbar"; $("#puls").style.background="var(--down)"; }
}
function listeFuer(id){
  if(id==="t-start") return D.radar.spiele.filter(s=>s.xnorm!=null).slice(0,8);
  return BF_SETS[filterBf][1](D.radar.spiele);
}
function aufklappen(tr){
  const naechste = tr.nextElementSibling;
  if(naechste && naechste.classList.contains("detail")){ naechste.remove(); tr.classList.remove("offen"); tr.setAttribute("aria-expanded","false"); return; }
  const id = tr.closest("table").id, art = tr.dataset.art;
  const s = (art ? TL[id] : listeFuer(id))?.[+tr.dataset.i]; if(!s) return;
  tr.classList.add("offen"); tr.setAttribute("aria-expanded","true");
  tr.insertAdjacentHTML("afterend", art==="poly" ? polyDetail(s) : art==="pinn" ? pinDetail(s) : art==="hz" ? hzDetail(s) : spielDetail(s));
}
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-geh]"); if(g){ gehe(g.dataset.geh); window.scrollTo({top:0}); return; }
  const pu = e.target.closest("[data-push]"); if(pu){ filterPush = pu.dataset.push; $("#pushpanel").innerHTML = pushPanel(D); return; }
  const f = e.target.closest("[data-filter]"); if(f){ filterBf = f.dataset.filter; $("#s-betfair").innerHTML = seiteBetfair(D); return; }
  const m = e.target.closest("[data-mehr]");
  if(m){ const id=m.dataset.mehr; $("#"+id).querySelector("tbody").innerHTML = listeFuer(id).map((s,i)=>spielZeile(s,i)).join(""); m.remove(); return; }
  if(e.target.closest("a")) return;
  const tr = e.target.closest("tr.zeile"); if(tr) aufklappen(tr);
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const tr=e.target.closest?.("tr.zeile"); if(tr) aufklappen(tr); } });
try{ const s = localStorage.getItem("radar-seite2"); if(s && SEITEN.some(x=>x[0]===s)) aktiv = s; }catch(_){}
laden();
setInterval(laden, 5*60*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) laden(); });
</script>
</body>
</html>

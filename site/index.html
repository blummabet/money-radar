<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1320">
<title>Geldradar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1320; --panel:#151d2d; --panel-2:#1b2538; --panel-3:#233049;
  --text:#e9eef7; --text-2:#9aa7bd; --text-3:#64718a;
  --line:rgba(255,255,255,.065);
  --bf:#ffb547; --pin:#5b9dff; --poly:#a183ff; --stake:#2fd38a; --hz:#ff77a8;
  --up:#2fd38a; --down:#ff6b6b;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pin);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:0 10px 22px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,var(--bf),var(--poly),var(--pin),var(--stake),var(--bf));display:grid;place-items:center}
.logo-mark::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg)}
.nav{background:none;border:0;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--text-2);font-weight:600;font-size:14px;text-align:left;width:100%}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.an{background:var(--panel-2);color:var(--text)}
.nav .dot{width:9px;height:9px;border-radius:3px;flex:none}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--text-2);background:var(--panel-3);border-radius:999px;padding:1px 7px}
.aside-fuss{margin-top:auto;padding:12px;font-size:12px;color:var(--text-3)}
.aside-fuss .q{display:flex;align-items:center;gap:7px;margin:4px 0;color:var(--text-2)}
.q i{width:7px;height:7px;border-radius:50%;flex:none}

main{padding:22px 28px 60px;min-width:0}
.kopf{display:flex;align-items:center;gap:14px;margin:-22px -28px 20px;padding:14px 28px;position:sticky;top:0;z-index:15;background:rgba(13,19,32,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.kopf h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.kopf .sub{color:var(--text-2);font-size:13px}
.kopf .rechts{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.puls{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(47,211,138,.6);animation:puls 2s infinite}
@keyframes puls{70%{box-shadow:0 0 0 8px rgba(47,211,138,0)}100%{box-shadow:0 0 0 0 rgba(47,211,138,0)}}
@media (prefers-reduced-motion:reduce){.puls{animation:none}}

.seite{display:none}.seite.an{display:block}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{margin:0;font-size:15px;font-weight:700;white-space:nowrap}
.ph{display:flex;align-items:center;gap:6px 10px;margin-bottom:14px;flex-wrap:wrap}
.ph .hint{color:var(--text-3);font-size:12.5px}
.ph .rechts{margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip.an{background:var(--text);color:var(--bg);border-color:var(--text)}

.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lab{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;font-weight:600}
.ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.kpi .wert{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .neben{font-size:12.5px;color:var(--text-2)}
.kpi svg{position:absolute;right:14px;bottom:14px}

.tab{width:100%;border-collapse:collapse}
.tab th{text-align:left;font-size:12px;font-weight:600;color:var(--text-3);padding:0 10px 10px;white-space:nowrap}
.tab th.r,.tab td.r{text-align:right}
.tab td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tab tr.zeile{cursor:pointer}
.tab tr.zeile:hover td{background:rgba(255,255,255,.025)}
.tab tr.offen td{background:var(--panel-2)}
.tab tr.detail td{background:var(--panel-2);border-top:0;padding:4px 16px 18px}
.spiel{display:flex;align-items:center;gap:10px;min-width:0;max-width:300px}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.nur-m{display:none}
.ohne-vt .vt{display:none}
.flag{width:22px;height:16px;border-radius:3px;object-fit:cover;flex:none;background:var(--panel-3)}
.spiel .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spiel .l{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12.5px;color:var(--text-2);white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--down);font-weight:700;white-space:nowrap}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--down)}
.geld{font-weight:800;font-size:14.5px;white-space:nowrap}
.plus{color:var(--up);font-weight:700;font-size:12px;white-space:nowrap}
.norm{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:3px 9px;border-radius:8px;font-weight:800;font-size:13px}
.vbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;min-width:110px;background:var(--panel-3)}
.vbar span{height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2);margin-top:6px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.leg b{color:var(--text)}
.det{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:22px;padding-top:6px}
.det h4{margin:0 0 8px;font-size:12.5px;color:var(--text-3);font-weight:600}
.mini-liste{font-size:13px;color:var(--text-2)}
.mini-liste div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.mini-liste b{color:var(--text)}

.feed{display:flex;flex-direction:column}
.ticker{display:none}
.feed-gross .fe{padding:12px 4px}
.feed-gross .fe .t{font-size:14.5px}
.fe[data-dr]{cursor:pointer}
.fe-live{box-shadow:inset 3px 0 0 var(--down);padding-left:8px!important}
.feedchips{margin-bottom:6px;flex-wrap:wrap}
.fe{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fe:first-child{border-top:0}
.fe .ico{width:34px;height:34px;border-radius:10px}
.fe .t{font-weight:600;font-size:13.5px;line-height:1.3}
.fe .s{font-size:12px;color:var(--text-3);margin-top:2px}
.fe .b{text-align:right;font-weight:800;white-space:nowrap}
.fe .b small{display:block;font-weight:600;font-size:11.5px;color:var(--text-3)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;vertical-align:1px;margin-left:5px;white-space:nowrap}
.t-won{background:rgba(47,211,138,.14);color:var(--up)}.t-lost{background:rgba(255,107,107,.14);color:var(--down)}.t-open{background:var(--panel-3);color:var(--text-2)}

.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.karte{background:var(--panel-2);border-radius:13px;padding:14px;border:1px solid var(--line)}
.karte .k1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.karte .auf{font-weight:800;font-size:15px;display:flex;align-items:center;gap:4px}
.karte .auf .sico{width:18px;height:18px;font-size:13px}
.karte .pp{font-weight:800;color:var(--pin);font-size:15px;white-space:nowrap}
.karte .sp{font-size:12px;color:var(--text-3);margin-top:2px}
.karte .unten{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-2);margin-top:8px}
.karte svg{width:100%;margin-top:6px}

.ringe{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px 10px;text-align:center}
.ring .w{font-size:12px;color:var(--text-2);margin-top:6px;line-height:1.3}
.ring .w b{display:block;color:var(--text);font-size:13px}

.leer{color:var(--text-3);padding:18px 0;text-align:center}
.sico{width:22px;height:22px;display:grid;place-items:center;font-size:15px;flex:none}
.gk{display:grid;grid-template-columns:22px 60px 38px 1fr;align-items:center;gap:6px;font-size:12px;white-space:nowrap;padding:1px 0}
.gk-l{font-weight:800;font-size:11px}
.gk-bar{height:6px;border-radius:3px;background:var(--panel-3);overflow:hidden}
.gk-bar i{display:block;height:100%}
.gk b{text-align:right}
.gk-auf{color:var(--text-2);overflow:hidden;text-overflow:ellipsis}
.zufluss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.zf{background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:14px;border-left:3px solid var(--up)}
.zf-kopf{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.zf-betrag{font-weight:800;font-size:22px;color:var(--up);text-align:right;white-space:nowrap;line-height:1.1}
.zf-betrag small{display:block;font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:3px}
.zf-auf{font-size:13px;color:var(--text-2);margin:8px 0 2px}
.zf-auf b{color:var(--text)}
.quoten-zug{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.quoten-zug .alt{font-size:15px;color:var(--text-3);font-weight:700;text-decoration:line-through}
.quoten-zug .pfeil{color:var(--text-3)}
.quoten-zug .neu{font-size:24px;font-weight:800;color:var(--text)}
.push-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));column-gap:28px}
.push-raster .fe:first-child{border-top:1px solid var(--line)}
.mehr{background:none;border:0;color:var(--text-2);font-weight:700;padding:12px 0 0;font-size:13px}
.mehr:hover{color:var(--text)}
.hinweis{font-size:12.5px;color:var(--text-3);margin-top:12px}

.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--text-2);white-space:nowrap}
.seg button.an{background:var(--text);color:var(--bg)}
#ligaschalter{margin-left:auto}
#ligaschalter + .rechts{margin-left:10px}
.live-k{border-left:3px solid var(--down)}
.fl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-2);border-top:1px solid var(--line);padding-top:5px;margin-top:5px}
.fl small{color:var(--text-3)}
.fl b{color:var(--up)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kk{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color .15s}
.kk:hover{border-color:rgba(255,255,255,.18)}
.kk-poly{border-color:color-mix(in srgb,var(--poly) 45%,transparent)}
.zf-k{border-left:3px solid var(--up)}
.kk-oben{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);min-width:0}
.kk-oben>span:not(.rechts){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kk-oben .rechts{margin-left:auto;white-space:nowrap}
.kk-oben .flag,.kk-oben .sico{width:18px;height:13px;font-size:12px}
.kk-titel{font-weight:700;font-size:14.5px;line-height:1.3}
.kk-zahl{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.1;margin-top:6px}
.kk-klein{font-size:12px;color:var(--text-3)}
.kk-auf{font-size:13px;color:var(--text-2);margin:6px 0 2px}
.kk-auf b{color:var(--text)}
.kk-reihe{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kk-reihe svg{width:64px;height:64px}
.kk-fuss{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.kk-fuss .tag{margin-left:0}
.gruen{color:var(--up)}.hoch{color:var(--up);font-weight:700}.runter{color:var(--down);font-weight:700}
.pbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:8px}
.pleg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--text-2)}
.pleg i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px}
.pleg b{color:var(--text)}
.qpills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.qpills div{background:var(--panel-3);border-radius:9px;padding:6px 8px;text-align:center}
.qpills small{display:block;font-size:11px;color:var(--text-3)}
.qpills b{font-size:16px}
.qpills div{position:relative;border:1px solid transparent}
.qpills .q-ok{border-color:rgba(47,211,138,.55);background:rgba(47,211,138,.10)}
.qpills .q-no{border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.08)}
.qpills .q-ok b{color:var(--up)} .qpills .q-no b{color:var(--down);opacity:.85}
.qpills .q-z{position:absolute;top:4px;right:6px;font-size:12px;font-weight:800}
.qpills .q-ok .q-z{color:var(--up)} .qpills .q-no .q-z{color:var(--down)}
.qpills .q-tipp{box-shadow:inset 0 -2px 0 var(--hz)}
.qpills .q-tipp small{color:var(--text-2)}
.hz-end{font-weight:800;font-size:13px;padding:1px 8px;border-radius:999px;background:var(--panel-3);color:var(--text)}
.hz-lauf{font-size:12px;color:var(--text-3)}
.nchart{display:flex;flex-direction:column;gap:2px}
.nz{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 92px;gap:14px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer;color:inherit}
.nz:hover{background:rgba(255,255,255,.03)}
.nz-l{display:flex;align-items:center;gap:10px;min-width:0}
.nz-l .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nz-l .l{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nz-bar{position:relative;height:22px;background:var(--panel-3);border-radius:6px;overflow:hidden}
.nz-bar i{position:absolute;left:0;top:0;bottom:0;opacity:.35;border-radius:6px}
.nz-bar span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-weight:800;font-size:13px;white-space:nowrap}
.nz-bar em{font-style:normal;font-weight:600;font-size:11.5px;color:var(--text-2);margin-left:6px}
.nz-r{text-align:right;white-space:nowrap}
.nz-r b{display:block;font-size:14.5px}
.nz-r small{font-size:11.5px;color:var(--text-3)}
.rang{width:22px;height:22px;border-radius:50%;background:var(--panel-3);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.als-liste{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.panel>.als-liste:first-child{border-top:0;padding-top:0;margin-top:0}
.als-liste summary{cursor:pointer;font-weight:700;color:var(--text-2);list-style:none;display:flex;align-items:center;gap:8px}
.als-liste summary::before{content:"▸";transition:transform .15s}
.als-liste[open] summary::before{transform:rotate(90deg)}
.als-liste summary span{color:var(--text-3);font-weight:600}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:40;transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;padding:20px}
.dr-schleier{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
.dr-offen .drawer{transform:none}.dr-offen .dr-schleier{opacity:1;pointer-events:auto}
.dr-kopf{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dr-kopf h3{margin:0;font-size:17px}
.dr-x{margin-left:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;width:34px;height:34px}
.drawer .det{grid-template-columns:1fr;gap:20px}
.drawer .det svg{width:100%}
.d-kopf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.d-kopf .flag{display:inline-block!important}
.dz{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.dz:first-of-type{border-top:0}
.dz-l{min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dz-l small{color:var(--text-3)}
.dz-bar{height:10px;background:var(--panel-3);border-radius:5px;overflow:hidden}
.dz-bar i{display:block;height:100%;background:var(--up);border-radius:5px}
.dz-r{text-align:right;font-weight:800;color:var(--up);white-space:nowrap;font-size:13.5px}
.dz-r small{display:block;font-weight:600;font-size:11px;color:var(--text-3)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mk{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.mk-k{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;margin-bottom:4px}
.mk-k span{color:var(--text-2);font-weight:700;white-space:nowrap}
.mk-k em,.mk-l em{font-style:normal;color:var(--up);font-weight:700}
.mk-i{display:flex;align-items:center;gap:8px}
.mk-i svg{flex:none}
.mk-l{flex:1;min-width:0;font-size:12px;color:var(--text-2)}
.mk-l div{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;gap:5px;align-items:center;padding:1.5px 0}
.mk-l i{width:8px;height:8px;border-radius:2px}
.mk-l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-l b{color:var(--text)}
.mk-l small{color:var(--text-3)}
.mb{padding:10px 0;border-top:1px solid var(--line)}
.mb:first-of-type{border-top:0;padding-top:2px}
.mb-k{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:7px}
.mb-k span{color:var(--text-2);font-weight:700}
.mb-k em,.mb-l em{font-style:normal;color:var(--up);font-weight:700}
.mb-l{margin-top:6px;font-size:12.5px;color:var(--text-2)}
.mb-l div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.mb-l i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.mb-l small{color:var(--text-3)}
.mb-l b{color:var(--text)}
@media (prefers-reduced-motion:reduce){.drawer,.dr-schleier{transition:none}}
.unten-nav{display:none}
@media (max-width:1180px){
  .c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .c4.feedpanel{grid-row:auto}
}
@media (max-width:860px){

<body>
<div class="app">
<aside>
  <div class="logo"><span class="logo-mark"></span>Geldradar</div>
  <div id="navliste"></div>
  <div class="aside-fuss"><div style="margin-bottom:6px">Datenstand</div><div id="quellen"></div></div>
</aside>
<main>
  <div class="kopf"><div><h1 id="titel">Übersicht</h1><div class="sub" id="untertitel"></div></div><div id="ligaschalter"></div><div class="rechts"><span class="puls" id="puls"></span><span id="stand">lädt</span></div></div>
  <section class="seite an" id="s-start"></section>
  <section class="seite" id="s-feed"></section>
  <section class="seite" id="s-betfair"></section>
  <section class="seite" id="s-pinnacle"></section>
  <section class="seite" id="s-poly"></section>
  <section class="seite" id="s-stake"></section>
  <section class="seite" id="s-hz"></section>
</main>
</div>
<nav class="unten-nav" id="untennav" aria-label="Bereiche"></nav>
<div class="dr-schleier" data-zu></div>
<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-titel"><div class="dr-kopf"><h3 id="dr-titel"></h3><button class="dr-x" data-zu aria-label="Schließen">✕</button></div><div id="dr-inhalt"></div></aside>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TZ = "Europe/Vienna";
const uhr = iso => iso ? new Date(iso).toLocaleTimeString("de-AT",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}) : "";
const wtag = iso => new Date(iso).toLocaleDateString("de-AT",{timeZone:TZ,weekday:"short"});
const minBis = iso => Math.round((new Date(iso)-Date.now())/60000);
function wann(iso){
  if(!iso) return "";
  const m = minBis(iso);
  if(m <= 0) return "läuft";
  if(m < 60) return `in ${m} Min`;
  if(m < 12*60) return `in ${Math.floor(m/60)}:${String(m%60).padStart(2,"0")} h`;
  const heute = new Date().toLocaleDateString("de-AT",{timeZone:TZ}) === new Date(iso).toLocaleDateString("de-AT",{timeZone:TZ});
  return (heute ? "" : wtag(iso)+" ") + uhr(iso);
}
function vor(iso){
  const m = Math.round((Date.now()-new Date(iso))/60000);
  if(m < 1) return "jetzt"; if(m < 60) return `vor ${m} Min`;
  const h = Math.floor(m/60); return h < 24 ? `vor ${h} h` : `vor ${Math.floor(h/24)} T`;
}
const kurz = (v, z) => { if(v==null) return "–"; const a=Math.abs(v), s=v<0?"-":"";
  return s+z+(a>=1e6?(a/1e6).toFixed(a>=1e7?0:1).replace(".",",")+" Mio":a>=1e4?Math.round(a/1e3)+"k":a>=1e3?(a/1e3).toFixed(1).replace(".",",")+"k":Math.round(a)); };
const eur = v => kurz(v,"€"), usd = v => kurz(v,"$");
const dez = (v,n=1) => v==null ? "–" : Number(v).toFixed(n).replace(".",",");
const q2 = v => v==null ? "–" : Number(v).toFixed(2).replace(".",",");
const istRemis = n => /^(the draw|draw|remis)/i.test(n||"");
const nm = n => istRemis(n) ? "Remis" : n;
const flagge = cc => {
  cc = String(cc||"").toLowerCase(); if(cc==="uk") cc="gb";
  return /^[a-z]{2}$/.test(cc) ? `<img class="flag" src="https://flagcdn.com/w40/${cc}.png" alt="" loading="lazy">` : `<span class="flag" style="display:grid;place-items:center;font-size:10px;color:var(--text-3)">◎</span>`;
};
const FARBE = {betfair:"var(--bf)",pinnacle:"var(--pin)",poly:"var(--poly)",stake:"var(--stake)",hz:"var(--hz)"};
const ICO = {betfair:"BF",pinnacle:"PIN",poly:"PM",stake:"ST",hz:"HZ"};
const tint = (farbe, a) => `color-mix(in srgb, ${farbe} ${a}%, transparent)`;
const icon = q => `<span class="ico" style="background:${tint(FARBE[q],16)};color:${FARBE[q]}">${ICO[q]}</span>`;

function spark(werte, farbe, w=110, h=32){
  if(!werte || werte.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const min=Math.min(...werte), max=Math.max(...werte), sp=(max-min)||1;
  const pt = werte.map((v,i)=>[i/(werte.length-1)*w, h-2-(v-min)/sp*(h-5)]);
  const d = pt.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const id = "g"+Math.random().toString(36).slice(2,8);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${farbe}" stop-opacity=".35"/><stop offset="1" stop-color="${farbe}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${farbe}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function ring(prozent, farbe, mitte){
  const r=34, u=2*Math.PI*r, p=Math.max(0,Math.min(100,prozent||0));
  return `<svg width="86" height="86" viewBox="0 0 86 86" aria-hidden="true"><circle cx="43" cy="43" r="${r}" fill="none" stroke="var(--panel-3)" stroke-width="8"/><circle cx="43" cy="43" r="${r}" fill="none" stroke="${farbe}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(u*p/100).toFixed(1)} ${u.toFixed(1)}" transform="rotate(-90 43 43)"/><text x="43" y="48" text-anchor="middle" fill="#e9eef7" font-size="14" font-weight="800" font-family="Manrope">${esc(mitte)}</text></svg>`;
}
function farbeTeil(teile){
  const top = Math.max(...teile.filter(t=>!istRemis(t.name)).map(t=>t.wert));
  return t => istRemis(t.name) ? "var(--text-3)" : t.wert===top ? "var(--bf)" : "var(--pin)";
}
function vbar(teile){
  teile = (teile||[]).filter(t=>t.wert>0);
  const ges = teile.reduce((a,t)=>a+t.wert,0); if(!ges) return "";
  const f = farbeTeil(teile);
  return `<div class="vbar">${teile.map(t=>`<span style="flex:${t.wert} 1 0;background:${f(t)}" title="${esc(nm(t.name))} ${Math.round(t.wert/ges*100)} %"></span>`).join("")}</div>`;
}
function legende(teile, zusatz){
  teile = (teile||[]).filter(t=>t.wert>0);
  const ges = teile.reduce((a,t)=>a+t.wert,0); if(!ges) return "";
  const f = farbeTeil(teile);
  return `<div class="leg">${teile.map(t=>`<span><i style="background:${f(t)}"></i>${esc(nm(t.name))} <b>${Math.round(t.wert/ges*100)} %</b>${zusatz?" "+zusatz(t):""}</span>`).join("")}</div>`;
}
function normPill(x){
  if(x==null) return `<span class="norm" style="background:var(--panel-3);color:var(--text-3)">–</span>`;
  const f = x>=3 ? "#ff5d5d" : x>=1.5 ? "#ff9f43" : x>=1 ? "#ffd166" : "#7d8aa3";
  return `<span class="norm" style="background:${tint(f,18)};color:${f}">×${dez(x)}</span>`;
}

function statusZelle(s){
  if(s.live) return `<span class="live">${s.live.ht?"HZ":s.live.min!=null?s.live.min+"'":"live"}</span> <b>${s.live.stand?.[0]??0}:${s.live.stand?.[1]??0}</b>`;
  return `<span class="status">${wann(s.anpfiff)}</span>`;
}
function spielZeile(s, i){
  const vt = s.verteilung ? s.verteilung.map(v=>({name:v.name,wert:v.eur})) : null;
  return `<tr class="zeile" data-i="${i}" tabindex="0" aria-expanded="false">
    <td><div class="spiel">${flagge(s.land)}<div style="min-width:0"><div class="n">${esc(s.heim)} – ${esc(s.gast)}</div><div class="l"><span class="nur-m">${s.live?`<span style="color:var(--down);font-weight:700">${s.live.ht?"HZ":s.live.min!=null?s.live.min+"'":"live"} ${s.live.stand?.[0]??0}:${s.live.stand?.[1]??0}</span>`:wann(s.anpfiff)}, </span>${esc(s.liga)}</div></div></div></td>
    <td class="hide-m">${statusZelle(s)}</td>
    <td class="r"><div class="geld">${eur(s.eur)}</div>${s.d60>0?`<div class="plus">+${eur(s.d60)} in 1 h</div>`:""}</td>
    <td class="r">${normPill(s.xnorm)}</td>
    <td class="hide-m">${spark(s.kurve, "var(--bf)")}</td>
    <td class="hide-m vt">${vt?vbar(vt):`<span style="color:var(--text-3);font-size:12px;white-space:nowrap">${s.quoten.heim?`${q2(s.quoten.heim)} / ${q2(s.quoten.remis)} / ${q2(s.quoten.gast)}`:""}</span>`}</td>
  </tr>`;
}
function spielDetail(s){
  const md = s.maerkteDetail || [], fm = s.fensterMin || 30;
  const PAL = ["#ffb547","#5b9dff","#7d8aa3","#a183ff","#2fd38a","#ff77a8"];
  // 1) wohin floss das neue Geld — quer über alle Märkte, je Auswahl
  const fl = [];
  for(const m of md) for(const a of m.auswahl) if(a.neu>0) fl.push({markt:m.name, name:a.name, neu:a.neu, quote:a.quote, anteil: m.neu? Math.round(a.neu/m.neu*100):null});
  fl.sort((x,y)=>y.neu-x.neu);
  const maxF = Math.max(1, ...fl.map(f=>f.neu));
  const flussBlock = fl.length ? fl.slice(0,6).map(f=>`<div class="dz"><div class="dz-l"><b>${esc(auswahlDe(f.name))}</b> <small>${esc(marktDe(f.markt))}${f.quote?` @ ${q2(f.quote)}`:""}</small></div>
      <div class="dz-bar"><i style="width:${(f.neu/maxF*100).toFixed(1)}%"></i></div><div class="dz-r">+${eur(f.neu)}${f.anteil!=null?`<small>${f.anteil} % des Marktes</small>`:""}</div></div>`).join("")
    : `<div class="kk-klein">In den letzten ${fm} Minuten kam kein neues Geld dazu, oder die Historie reicht noch nicht.</div>`;
  // 2) jeder Markt als Kreis (Lucas 17.10.: „spart Höhe") — Kacheln, zwei nebeneinander
  const donut = (teile, mitte) => {
    const R = 26, U = 2*Math.PI*R, ges = teile.reduce((x,t)=>x+t.w,0)||1; let off = 0;
    return `<svg width="70" height="70" viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="35" r="${R}" fill="none" stroke="var(--panel-3)" stroke-width="10"/>${teile.map(t=>{ const l = t.w/ges*U; const c = `<circle cx="35" cy="35" r="${R}" fill="none" stroke="${t.f}" stroke-width="10" stroke-dasharray="${l.toFixed(2)} ${(U-l).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 35 35)"/>`; off += l; return c; }).join("")}<text x="35" y="39" text-anchor="middle" fill="#e9eef7" font-size="12" font-weight="800" font-family="Manrope">${mitte}</text></svg>`;
  };
  const marktBlock = `<div class="mgrid">${md.map(m=>{
    const ges = m.auswahl.reduce((x,a)=>x+a.eur,0)||1;
    const teile = m.auswahl.map((a,i)=>({w:a.eur, f:PAL[i%PAL.length]}));
    return `<div class="mk"><div class="mk-k"><b>${esc(marktDe(m.name))}</b><span>${eur(m.eur)}${m.neu>0?` <em>+${eur(m.neu)}</em>`:""}</span></div>
      <div class="mk-i">${donut(teile, Math.round(m.auswahl[0].eur/ges*100)+"%")}
      <div class="mk-l">${m.auswahl.slice(0,4).map((a,i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i><span>${esc(auswahlDe(a.name))}${a.quote?` <small>${q2(a.quote)}</small>`:""}</span><b>${Math.round(a.eur/ges*100)}%</b>${a.neu>0?`<em>+${eur(a.neu)}</em>`:""}</div>`).join("")}</div></div></div>`;
  }).join("")}</div>`;
  return `<tr class="detail"><td colspan="6"><div class="det">
    <div class="d-kopf">${flagge(s.land)} ${esc(s.liga)} · ${s.live?`<span class="live">${s.live.min!=null?s.live.min+"'":"live"}</span> ${s.live.stand?.[0]??0}:${s.live.stand?.[1]??0}`:wann(s.anpfiff)} · ${eur(s.eur)} gematcht${s.xnorm!=null?` · ×${dez(s.xnorm)} der Liga`:""}</div>
    <div><h4>Wohin das neue Geld floss, letzte ${fm} Min</h4>${flussBlock}</div>
    <div><h4>Märkte</h4>${marktBlock||"–"}</div>
    <div><h4>Geld im Spiel, letzte 10 Stunden</h4>${spark(s.kurve,"var(--bf)",320,48)}</div>
  </div></td></tr>`;
}
function spielTabelle(liste, id, max, mitVt=true){
  if(!liste.length) return `<div class="leer">Keine Spiele in dieser Auswahl.</div>`;
  return `<div class="tw"><table class="tab${mitVt?"":" ohne-vt"}" id="${id}"><thead><tr><th>Spiel</th><th class="hide-m">Anpfiff</th><th class="r">Geld</th><th class="r">Norm</th><th class="hide-m">Verlauf</th><th class="hide-m vt">Verteilung</th></tr></thead>
    <tbody>${liste.slice(0,max).map((s,i)=>spielZeile(s,i)).join("")}</tbody></table></div>
    ${liste.length>max?`<button class="mehr" data-mehr="${id}">Alle ${liste.length} Spiele zeigen</button>`:""}`;
}

// ── alle Pushes einer Quelle in einer Liste ─────────────────────────
const tagFuer = s => s==="won"?`<span class="tag t-won">gewonnen</span>`:s==="lost"?`<span class="tag t-lost">verloren</span>`:s==="pending"?`<span class="tag t-open">offen</span>`:"";
const statusTag = s => s==="won"?`<span class="tag t-won">gewonnen</span>`:s==="lost"?`<span class="tag t-lost">verloren</span>`:"";
const stakeStatus = x => x.status==="abgerechnet"&&x.rendite!=null ? (x.rendite>0?"won":"lost") : "pending";
function allePushes(D){
  const f = [];
  for(const p of D.bfPushes.liste) f.push({q:"betfair", t:`${p.auf} @ ${q2(p.quote)}`, s:`${p.heim} – ${p.gast}, ${p.liga}, ${p.anteil} % des Geldes`, b:eur(p.eur), zeit:p.zeit, status:p.status});
  for(const w of D.poly.tradesPushes||[]) f.push({q:"poly", t:`${SPORT_ICO[w.sport]||""} Wal auf ${nm(/^draw/i.test(w.seite)?"Draw":w.seite)} @ ${Math.round((w.preis||0)*100)} ¢`, s:w.spiel, b:usd(w.usd), zeit:w.zeit, status:w.status});
  for(const x of D.stake.gruppen||[]) f.push({q:"stake", t:`${x.auswahl}${x.quote?" @ "+q2(x.quote):""}`, s:`${x.spiel}, ${x.arten.join(" + ")}`, b:usd(x.usd), zeit:x.zeit, status:stakeStatus(x)});
  for(const h of D.hz.heute) f.push({q:"hz", t:`0:0 zur Pause, Tor 2. HZ @ ${q2(h.quoten?.over05)}`, s:`${h.spiel}, ${h.liga}`, b:"0:0", zeit:h.zeit});
  return f.sort((a,b)=>new Date(b.zeit)-new Date(a.zeit));
}
const feZeile = x => `<div class="fe">${icon(x.q)}<div style="min-width:0"><div class="t">${esc(x.t)}${statusTag(x.status)}</div><div class="s">${esc(x.s)}</div></div><div class="b">${esc(x.b)}<small>${x.zeit?vor(x.zeit):""}</small></div></div>`;
// Lucas 17.10.: „Der Live-Feed gefällt mir, der muss prominenter werden" — eigener Menüpunkt,
// und er zeigt jetzt auch die neuen Geldflüsse (live, vor Anpfiff, Polymarket), nicht nur Pushes.
function feedEintraege(D){
  const f = allePushes(D).map(x=>({...x, k:x.q==="betfair"?"push":x.q}));
  const bfZeit = D.quellen?.betfair, pfZeit = D.polyFluss?.stand;
  for(const x of lf(D.liveZufluss||[])){ const fl = (x.fluss||[])[0]; if(!fl) continue; const lv = x.live||{}, st = lv.stand||[0,0];
    f.push({q:"betfair", k:"live", live:true, t:`+${eur(fl.eur)} auf ${auswahlDe(fl.auswahl)} @ ${q2(fl.quote)}`, s:`${x.heim} – ${x.gast}, ${lv.min!=null?lv.min+"'":"live"} ${st[0]}:${st[1]}, ${marktDe(fl.markt)} (${fl.anteil} %)`, b:eur(fl.eur), zeit:bfZeit, sp:x, wert:fl.eur}); }
  for(const x of lf(D.zufluss30||[])){ const fl = (x.fluss||[])[0]; if(!fl) continue;
    f.push({q:"betfair", k:"zufluss", t:`+${eur(fl.eur)} auf ${auswahlDe(fl.auswahl)} @ ${q2(fl.quote)}`, s:`${x.heim} – ${x.gast}, ${wann(x.anpfiff)}, ${marktDe(fl.markt)} (${fl.anteil} %)`, b:eur(fl.eur), zeit:bfZeit, sp:x, wert:fl.eur}); }
  for(const m of (D.polyFluss?.maerkte||[]).filter(top5Ok)){ const fw = m.fenster?.["30"]; if(!fw || fw.usd<1000 || fw.anteil<55) continue;
    f.push({q:"poly", k:"pfluss", live:m.live, t:`+${usd(fw.usd)} auf ${pmLabel(fw.auf)}`, s:`${pmTitel(m.titel)}, ${fw.anteil} % der Käufe`, b:usd(fw.usd), zeit:pfZeit, wert:fw.usd}); }
  for(const s of lf(D.sharp).filter(s=>s.frisch||s.laeuftNoch)) f.push({q:"pinnacle", k:"pinnacle", t:`${s.auf}: Quote ${q2(s.vonQuote)} → ${q2(s.fairQuote)}`, s:`${s.heim} – ${s.gast}`, b:q2(s.fairQuote), zeit:D.quellen.pinnacle});
  // gleiche Zeit (eine Abrufrunde) → größere Beträge zuerst
  return f.sort((a,b)=>(new Date(b.zeit||0)-new Date(a.zeit||0)) || ((b.wert||0)-(a.wert||0)));
}
const feZeile2 = x => `<div class="fe${x.live?" fe-live":""}" ${x.sp?klickSpiel(x.sp):""}>${icon(x.q)}<div style="min-width:0"><div class="t">${x.live?`<span class="live">live</span> `:""}${esc(x.t)}${statusTag(x.status)}</div><div class="s">${esc(x.s)}</div></div><div class="b">${esc(x.b)}<small>${x.zeit?vor(x.zeit):""}</small></div></div>`;
function klickSpiel(x){ const sp = spielInfo(x); return sp ? klick(esc(x.heim)+" – "+esc(x.gast), ohneHuelle(spielDetail(sp))) : ""; }
function feedListe(D, n=12, jeArt=4){
  const je = {}, aus = [];
  for(const x of feedEintraege(D)){ je[x.k]=(je[x.k]||0)+1; if(je[x.k]>jeArt) continue; aus.push(x); }
  return aus.slice(0,n).map(feZeile2).join("") || `<div class="leer">Noch nichts passiert.</div>`;
}
const FEED_ARTEN = [["alle","Alle"],["live","Live"],["zufluss","Vor Anpfiff"],["pfluss","Polymarket"],["pinnacle","Pinnacle"],["stake","Stake"],["hz","HZ 0:0"],["push","Betfair-Pushes"],["poly","Wale"]];
let filterFeed = "alle";

  if(!z.length) return `<div class="leer">In den letzten 30 Minuten floss vor Anpfiff kein Geld einseitig auf eine Auswahl${ligaModus==="ohne"?" (ohne Top-5)":""}.</div>`;
  return `<div class="kgrid">${z.map(x=>{
    const vt = x.verteilung ? x.verteilung.map(v=>({name:v.name,wert:v.eur,quote:v.quote})) : null;
    const pf = x.quoteRichtung==="faellt" ? `<span class="hoch">↓ von ${q2(x.quoteVorher)}</span>` : x.quoteRichtung==="steigt" ? `<span class="runter">↑ von ${q2(x.quoteVorher)}</span>` : "";
    const sp = spielInfo(x);
    return `<div class="kk zf-k" ${klick(esc(x.heim)+" – "+esc(x.gast), sp?ohneHuelle(spielDetail(sp)):"")}>
      <div class="kk-oben">${flagge(x.land)}<span>${esc(x.liga)}</span><span class="rechts">${wann(x.anpfiff)}</span></div>
      <div class="kk-titel">${esc(x.heim)} – ${esc(x.gast)}</div>
      ${(x.fluss||[]).length ? flussKopf(x.fluss[0]) + flussZeilen(x.fluss,false) : `<div class="kk-zahl gruen">+${eur(x.zuflussEur)}</div><div class="kk-auf">auf <b>${esc(nm(x.meistesGeldAuf))}</b> @ <b>${q2(x.quote)}</b> ${pf}</div>${vt?vbar(vt):""}`}
      ${x.pinnacle && (x.fluss||[])[0]?.markt==="Match Odds"?`<div class="kk-fuss">${x.pinnacle.einig?`<span class="tag t-won">Pinnacle einig</span>`:`<span class="tag t-lost">Pinnacle anders</span>`}</div>`:""}
    </div>`;}).join("")}</div>`;
}
function liveKarten(D, max){
  const z = lf(D.liveZufluss||[]).slice(0, max);
  if(!z.length) return `<div class="leer">Gerade fließt live kein Geld einseitig auf eine Auswahl${ligaModus==="ohne"?" (ohne Top-5)":""}.</div>`;
  return `<div class="kgrid">${z.map(x=>{
    const vt = x.verteilung ? x.verteilung.map(v=>({name:v.name,wert:v.eur,quote:v.quote})) : null;
    const sp = spielInfo(x);
    return `<div class="kk live-k" ${klick(esc(x.heim)+" – "+esc(x.gast), sp?ohneHuelle(spielDetail(sp)):"")}>
      <div class="kk-oben">${flagge(x.land)}<span>${esc(x.liga)}</span><span class="rechts">${live(x)}</span></div>
      <div class="kk-titel">${esc(x.heim)} – ${esc(x.gast)}</div>
      ${(x.fluss||[]).length ? flussKopf(x.fluss[0]) + flussZeilen(x.fluss,false) : ""}
    </div>`;}).join("")}</div>`;
}
function normChart(liste){
  if(!liste.length) return `<div class="leer">Gerade liegt nirgends ungewöhnlich viel Geld.</div>`;
  const max = Math.max(3, ...liste.map(s=>s.xnorm||0));
  return `<div class="nchart">${liste.map(s=>{
    const x = s.xnorm||0, f = x>=3 ? "#ff5d5d" : x>=1.5 ? "#ff9f43" : x>=1 ? "#ffd166" : "#7d8aa3";
    return `<div class="nz" ${klick(esc(s.heim)+" – "+esc(s.gast), ohneHuelle(spielDetail(s)))}>
      <div class="nz-l">${flagge(s.land)}<div style="min-width:0"><div class="n">${esc(s.heim)} – ${esc(s.gast)}</div><div class="l">${live(s)} · ${esc(s.liga)}</div></div></div>
      <div class="nz-bar"><i style="width:${(x/max*100).toFixed(1)}%;background:${f}"></i><span style="color:${f}">×${dez(x)}${s.rang?`<em> mehr als ${s.rang.weniger} von ${s.rang.n}</em>`:""}</span></div>
      <div class="nz-r"><b>${eur(s.eur)}</b>${s.d60>0?`<small class="gruen">+${eur(s.d60)} in 1 h</small>`:""}</div>
    </div>`;}).join("")}</div>`;
}
function hzKarten(liste){
  if(!liste.length) return `<div class="leer">Gerade kein nennenswertes Geld auf die erste Halbzeit.</div>`;
  return `<div class="kgrid">${liste.map(g=>{ const t = g.maerkte[0]; const fix = g.htZuMo!=null && g.htZuMo>=1;
    return `<div class="kk" ${klick(esc(g.heim)+" – "+esc(g.gast)+", Halbzeit", ohneHuelle(hzDetail(g)))}>
      <div class="kk-oben">${flagge(g.land)}<span>${esc(g.liga)}</span><span class="rechts">${live(g)}</span></div>
      <div class="kk-titel">${esc(g.heim)} – ${esc(g.gast)}</div>
      <div class="kk-reihe"><div><div class="kk-zahl">${eur(g.eur)}</div><div class="kk-klein">auf die 1. Halbzeit</div></div>${t?ring(t.anteil,"#ffb547",t.anteil+"%"):""}</div>
      ${t?`<div class="kk-auf">${HZNAME[t.name]||esc(t.name)}: <b>${esc(hzAuswahl(t.auf))}</b> @ <b>${q2(t.quote)}</b></div>`:""}
      ${fix?`<div class="kk-fuss"><span class="tag t-lost">mehr HZ- als Spielgeld, Fix?</span></div>`:""}
    </div>`;}).join("")}</div>`;
}
function preisBalken(m){
  const pr = Object.entries(m.preise||{}).map(([n,v])=>({name:seiteName(n),wert:v}));
  if(!pr.length) return "";
  const f = farbeTeil(pr);
  return `<div class="pbar">${pr.map(p=>`<span style="flex:${p.wert} 1 0;background:${f(p)}"></span>`).join("")}</div>
    <div class="pleg">${pr.map(p=>`<span><i style="background:${f(p)}"></i>${esc(p.name)} <b>${Math.round(p.wert*100)} ¢</b></span>`).join("")}</div>`;
}
const pmLabel = l => String(l||"").replace(/^gegen Draw.*$/i,"gegen Remis").replace(/^Draw.*$/i,"Remis").replace(/\(O\/U (\d)\.5\)/,"Über/Unter $1,5").replace(/^Over /,"Über ").replace(/^Under /,"Unter ").replace(/Both Teams to Score/,"Beide treffen");
const pmTitel = t => String(t||"").replace(/^(Counter-Strike|League of Legends|Dota 2|Valorant): /,"").replace(/ - More Markets$/," (Tore)").replace(/ \(BO\d\).*$/,"");
const top5Ok = x => ligaModus==="alle" || (ligaModus==="ohne" ? !x.top5 : !!x.top5);
function polyFlussKarten(D, max){
  const pf = D.polyFluss || {};
  const z = (pf.maerkte||[]).filter(top5Ok).filter(m=>{ const f=m.fenster["30"]; return f && f.usd>=1000 && f.anteil>=55; }).slice(0,max);
  if(!z.length) return `<div class="leer">${pf.alt?"Der Polymarket-Abruf vom Mac ist gerade veraltet.":`In den letzten 30 Minuten floss auf Polymarket kein Geld einseitig auf eine Seite${ligaModus==="ohne"?" (ohne Top-5)":""}.`}</div>`;
  return `<div class="kgrid">${z.map(m=>{ const f = m.fenster["30"], f10 = m.fenster["10"];
    const seiten = Object.entries(f.seiten||{}).slice(1,3);
    const g = (m.gross||[])[0];
    return `<div class="kk ${m.live?"live-k":"kk-poly"}">
      <div class="kk-oben">${sportIco(m.sport)}<span>${esc(m.liga||m.sport||"")}</span><span class="rechts">${m.live?`<span class="live">live</span>`:wann(m.anpfiff)}</span></div>
      <div class="kk-titel">${esc(pmTitel(m.titel))}</div>
      <div class="kk-zahl" style="color:var(--poly)">+${usd(f.usd)}</div>
      <div class="kk-auf">auf <b>${esc(pmLabel(f.auf))}</b></div>
      <div class="kk-klein">${f.anteil} % der Käufe in 30 Min${f10&&f10.usd>=500?`, davon ${usd(f10.usd)} in den letzten 10 Min auf ${esc(pmLabel(f10.auf))}`:""}</div>
      ${seiten.map(([k,v])=>`<div class="fl"><span>${esc(pmLabel(k))}</span><b style="color:var(--text-2)">${usd(v)}</b></div>`).join("")}
      ${g?`<div class="kk-fuss"><span class="tag t-open">größter Kauf ${usd(g.usd)} @ ${Math.round(g.preis*100)} ¢, vor ${g.vor} Min</span></div>`:""}
    </div>`;}).join("")}</div>`;
}
function polyKarten(liste){
  if(!liste.length) return `<div class="leer">Keine Märkte in dieser Auswahl.</div>`;
  return `<div class="kgrid">${liste.map(m=>`<div class="kk${m.nBelegt?" kk-poly":""}" ${klick(esc(m.spiel), ohneHuelle(polyDetail(m)))}>
      <div class="kk-oben">${sportIco(m.sport)}<span>${esc(m.liga||m.sport||"")}</span><span class="rechts">${wann(m.anpfiff)}</span></div>
      <div class="kk-titel">${esc(m.spiel)}</div>
      <div class="kk-reihe"><div><div class="kk-zahl">${usd(m.usd)}</div><div class="kk-klein">Volumen</div></div>
        ${m.nBelegt?`<span class="tag" style="background:${tint("var(--poly)",18)};color:var(--poly)">${m.nBelegt} belegt</span>`:m.nWale?`<span class="status">${m.nWale} Wale</span>`:""}</div>
      ${preisBalken(m)}
    </div>`).join("")}</div>`;
}
function stakeKarten(gr){

      <div class="kk-fuss">${x.arten.map(a=>`<span class="tag t-open">${esc(a)}</span>`).join(" ")}</div>

function hzSpielKarten(liste){
  const nm2 = {over05:"Tor 2. HZ", over15:"2+ Tore", heim:"Heimsieg"};
  if(!liste.length) return `<div class="leer">Noch kein Spiel zur Pause 0:0.</div>`;
  // Pause war 0:0, also ist der Endstand genau die 2. Halbzeit
  const ausw = (k, ft) => { if(!Array.isArray(ft)) return null; const [h,a] = ft, t = h + a;
    return k==="over05" ? t>=1 : k==="over15" ? t>=2 : k==="heim" ? h>a : null; };
  return `<div class="kgrid">${liste.map(e=>{
    const ft = Array.isArray(e.ft) ? e.ft : null, tipps = e.gruppen||[];
    const istTipp = k => k==="heim" ? tipps.includes("heim") : tipps.includes("tore");
    const rechts = ft ? `<span class="hz-end">${ft[0]}:${ft[1]}</span>` : `<span class="hz-lauf">${(Date.now()-new Date(e.zeit))/6e4>75?"Ergebnis folgt":"läuft"} · ${uhr(e.zeit)}</span>`;
    return `<div class="kk">
      <div class="kk-oben">${flagge(e.land)}<span>${esc(e.liga)}</span><span class="rechts">${rechts}</span></div>
      <div class="kk-titel">${esc(e.spiel)}</div>
      <div class="qpills">${Object.entries(nm2).map(([k,n])=>{ const r = ausw(k, ft);
        const kl = [r===true?"q-ok":r===false?"q-no":"", istTipp(k)?"q-tipp":""].join(" ");
        return `<div class="${kl}">${r===null?"":`<span class="q-z">${r?"✓":"✗"}</span>`}<small>${n}</small><b>${q2(e.quoten?.[k])}</b></div>`; }).join("")}</div>
    </div>`; }).join("")}</div>`;
}
function rangliste(ws){
  if(!ws.length) return `<div class="leer">Noch keine Wallet mit genug Historie.</div>`;
  const max = Math.max(...ws.map(w=>w.fensterClv||0), 1);
  return `<div class="nchart">${ws.slice(0,12).map((w,i)=>`<a class="nz" href="https://polymarket.com/profile/${encodeURIComponent(w.wallet)}" target="_blank" rel="noopener" style="text-decoration:none">
      <div class="nz-l"><span class="rang">${i+1}</span>${sportIco(w.sport)}<div style="min-width:0"><div class="n">Wallet ${esc(w.wallet.slice(2,6))}</div><div class="l">${w.fensterN} Wetten, Schnitt ${usd(w.schnittUsd)}${w.offen.length?`, <span style="color:var(--poly)">${w.offen.length} offen</span>`:""}</div></div></div>
      <div class="nz-bar"><i style="width:${(w.fensterClv/max*100).toFixed(1)}%;background:var(--poly)"></i><span style="color:var(--poly)">+${dez(w.fensterClv)} pp</span></div>
      <div class="nz-r"><b style="color:${w.pnl>=0?"var(--up)":"var(--down)"}">${usd(w.pnl)}</b><small>Bilanz</small></div>
    </a>`).join("")}</div>`;
}
function bilanzRinge(D){
  const pb = D.bfPushes.bilanz, burst = D.stake.bilanz?.Burst, hz = (D.hz.bericht||[]).find(b=>/Heim/.test(b.wette)) || (D.hz.bericht||[])[0], wf = (D.poly.tradesBilanz||{})["Fußball"];
  const r = (p, f, roi, titel, unter) => `<div class="ring">${ring(p,f,(roi>0?"+":"")+dez(roi)+"%")}<div class="w"><b>${titel}</b>${unter}</div></div>`;
  return `<div class="ringe">
    ${wf?r(wf.treffer,"#a183ff",wf.roi,"Wale Fußball",`${wf.n} Tipps${wf.belegt?`<br><span class="gruen">belegt</span>`:""}`):""}
    ${burst?r(burst.treffer,"#2fd38a",burst.roi,"Stake-Burst",`${burst.n} Tipps`):""}
    ${hz?r(hz.treffer,"#ff77a8",hz.roi,"HZ Heimsieg",`${hz.n} Spiele`):""}
    ${r(pb.treffer,"#ffb547",pb.roi,"Betfair-Pushes",`${pb.n} Tipps`)}
  </div>`;
}

function seiteHz(D){
  const z = D.hz;
  return `<div class="grid">
    ${(z.bericht||[]).map(b=>`<div class="panel kpi c4"><div class="lab">${icon("hz")}${esc(b.wette)}</div><div class="wert" style="color:${b.roi>0?"var(--up)":"var(--down)"}">${b.roi>0?"+":""}${dez(b.roi)} %</div><div class="neben">${b.n} Spiele, getroffen ${dez(b.treffer,0)} % (erwartet ${dez(b.erwartet,0)} %)</div></div>`).join("")}
    <div class="panel c12"><div class="ph"><h3>Zur Pause 0:0</h3><span class="hint">letzte 24 Stunden, Quoten zur Pause · ✓/✗ nach Abpfiff · Strich unten = vom Signal gespielt</span></div>${hzSpielKarten(z.heute||[])}</div>
  </div>`;
}

const SEITEN = [["start","Übersicht","var(--text)"],["feed","Feed","var(--down)"],["betfair","Betfair","var(--bf)"],["pinnacle","Pinnacle","var(--pin)"],
  ["poly","Polymarket","var(--poly)"],["stake","Stake","var(--stake)"],["hz","HZ 0:0","var(--hz)"]];
const UNTER = {start:"Wo gerade das Geld liegt, quer über alle Quellen", betfair:"Jedes Spiel im Abruf, gemessen an seiner Liga", pinnacle:"Wohin die schärfste Quote zieht", poly:"Wer setzt, und wer davon nachweislich gut ist", stake:"Serien großer Einsätze", hz:"Spiele, die zur Pause anders laufen als erwartet", feed:"Alles, was gerade passiert, neueste zuerst"};
let aktiv = "start";
function navAufbauen(z){
  $("#navliste").innerHTML = SEITEN.map(([k,n,f])=>`<button class="nav${k===aktiv?" an":""}" data-geh="${k}"><span class="dot" style="background:${f}"></span>${n}${z[k]?`<span class="cnt">${z[k]}</span>`:""}</button>`).join("");
  $("#untennav").innerHTML = SEITEN.map(([k,n,f])=>`<button class="${k===aktiv?"an":""}" data-geh="${k}"><span class="dot" style="background:${f}"></span>${n.replace("Polymarket","Poly").replace("Übersicht","Start")}</button>`).join("");
}
function gehe(k){
  aktiv = k;
  document.querySelectorAll(".seite").forEach(s=>s.classList.toggle("an", s.id==="s-"+k));
  document.querySelectorAll("#navliste [data-geh], #untennav [data-geh]").forEach(b=>b.classList.toggle("an", b.dataset.geh===k));
  $("#titel").textContent = SEITEN.find(s=>s[0]===k)[1];
  $("#untertitel").textContent = UNTER[k];
  try{ localStorage.setItem("radar-seite2", k); }catch(_){}
}
function render(){
  drZaehler = 0; for(const k in DR) delete DR[k];
  // Wächter: wirft ein Bereich einen Fehler (z. B. ein Feld fehlt in den Daten), bleibt der Rest stehen
  const sicher = (sel, fn) => { try{ $(sel).innerHTML = fn(); }catch(e){ console.error(sel, e);
    $(sel).innerHTML = `<div class="panel"><div class="leer">Dieser Bereich konnte gerade nicht gebaut werden (${esc(String(e.message||e).slice(0,80))}). Der Rest läuft weiter.</div></div>`; } };
  sicher("#ligaschalter", ligaSchalter);
  sicher("#s-start", ()=>seiteStart(D));
  sicher("#s-feed", ()=>seiteFeed(D));
  sicher("#s-betfair", ()=>seiteBetfair(D));
  sicher("#s-pinnacle", ()=>seitePinnacle(D));
  sicher("#s-poly", ()=>seitePoly(D));
  sicher("#s-stake", ()=>seiteStake(D));
  sicher("#s-hz", ()=>seiteHz(D));
  try{ navAufbauen({betfair:D.radar.spiele.filter(s=>s.xnorm>=1.5).length, pinnacle:D.sharp.filter(s=>s.frisch||s.laeuftNoch).length,
    poly:D.poly.maerkte.filter(belegt).length, stake:(D.stake.gruppen||D.stake.heute).length, hz:D.hz.heute.length, feed:lf(D.liveZufluss||[]).length||null}); }
  catch(e){ console.error(e); navAufbauen({}); }
  gehe(aktiv);
}
function quellen(q){
  const n = {betfair:"Betfair",pinnacle:"Pinnacle",polymarket:"Polymarket",stake:"Stake",hz:"HZ-Finder"};
  let schlecht = 0;
  $("#quellen").innerHTML = Object.entries(n).map(([k,t])=>{
    const gut = k==="polymarket" ? 90 : 35, m = q[k] ? (Date.now()-new Date(q[k]))/60000 : 1e9, st = m<=gut?0:m<=gut*3?1:2; schlecht=Math.max(schlecht,st);
    return `<div class="q"><i style="background:${["var(--up)","var(--bf)","var(--down)"][st]}"></i>${t}<span style="margin-left:auto;color:var(--text-3)">${q[k]?vor(q[k]):"–"}</span></div>`;}).join("");
  $("#puls").style.background = ["var(--up)","var(--bf)","var(--down)"][schlecht];
}
async function laden(){
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    D = await r.json();
    $("#stand").textContent = "Stand " + uhr(D.generatedAt);
    quellen(D.quellen||{});
    render();
  }catch(e){ console.error(e); $("#stand").textContent = "Daten nicht erreichbar"; $("#puls").style.background="var(--down)"; }
}
function listeFuer(id){
  if(id==="t-start") return D.radar.spiele.filter(s=>s.xnorm!=null&&!s.entschieden).slice(0,8);
  return BF_SETS[filterBf][1](D.radar.spiele);
}
function aufklappen(tr){
  const naechste = tr.nextElementSibling;
  if(naechste && naechste.classList.contains("detail")){ naechste.remove(); tr.classList.remove("offen"); tr.setAttribute("aria-expanded","false"); return; }
  const id = tr.closest("table").id, art = tr.dataset.art;
  const s = (art ? TL[id] : listeFuer(id))?.[+tr.dataset.i]; if(!s) return;
  tr.classList.add("offen"); tr.setAttribute("aria-expanded","true");
  tr.insertAdjacentHTML("afterend", art==="poly" ? polyDetail(s) : art==="pinn" ? pinDetail(s) : art==="hz" ? hzDetail(s) : art==="zf" ? (D.radar.spiele.find(x=>x.id===s.id) ? spielDetail(D.radar.spiele.find(x=>x.id===s.id)) : "") : spielDetail(s));
}
document.addEventListener("click", e=>{
  if(e.target.closest("[data-zu]")){ drZu(); return; }
  const lg = e.target.closest("[data-liga]"); if(lg){ ligaModus = lg.dataset.liga; try{ localStorage.setItem("radar-liga", ligaModus); }catch(_){} render(); return; }
  const dk = e.target.closest("[data-dr]"); if(dk && !e.target.closest("a")){ drOeffnen(dk.dataset.dr); return; }
  const g = e.target.closest("[data-geh]"); if(g){ gehe(g.dataset.geh); window.scrollTo({top:0}); return; }
  const sp = e.target.closest("[data-sport]"); if(sp){ filterSport = sp.dataset.sport; $("#s-poly").innerHTML = seitePoly(D); return; }
  const fd = e.target.closest("[data-feed]"); if(fd){ filterFeed = fd.dataset.feed; $("#s-feed").innerHTML = seiteFeed(D); return; }
  const pu = e.target.closest("[data-push]"); if(pu){ filterPush = pu.dataset.push; $("#pushpanel").innerHTML = pushPanel(D); return; }
  const f = e.target.closest("[data-filter]"); if(f){ filterBf = f.dataset.filter; $("#s-betfair").innerHTML = seiteBetfair(D); return; }
  const m = e.target.closest("[data-mehr]");
  if(m){ const id=m.dataset.mehr; $("#"+id).querySelector("tbody").innerHTML = listeFuer(id).map((s,i)=>spielZeile(s,i)).join(""); m.remove(); return; }
  if(e.target.closest("a")) return;
  const tr = e.target.closest("tr.zeile"); if(tr) aufklappen(tr);
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") drZu(); if(e.key==="Enter"){ const dk=e.target.closest?.("[data-dr]"); if(dk){ drOeffnen(dk.dataset.dr); return; } } });
document.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const tr=e.target.closest?.("tr.zeile"); if(tr) aufklappen(tr); } });
try{ const s = localStorage.getItem("radar-seite2"); if(s && SEITEN.some(x=>x[0]===s)) aktiv = s; }catch(_){}
laden();
setInterval(laden, 5*60*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) laden(); });
</script>
</body>
</html>
